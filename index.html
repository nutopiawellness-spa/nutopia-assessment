<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salon Saint Tropez — Scheduler</title>
<meta name="description" content="Booking, stylist commission and daily revenue scheduler for Salon Saint Tropez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --grn:#6B7F3E;--grn-l:#A8BE72;--grn-d:#4A5A28;--grn-bg:rgba(140,166,88,.14);--grn-bd:rgba(168,190,114,.34);
  --bg:#0A0C07;--s1:#11150D;--s2:#171C11;--s3:#1E2416;--mid:#3A4028;--bd:#242B18;--bdl:#333C22;
  --wh:#F4F3EC;--mt:#8E9877;--red:#C0392B;--gold:#C9A84C;--cream:#EDEAD9;
  --sh:0 1px 0 rgba(255,255,255,.03),0 8px 24px -12px rgba(0,0,0,.8);
  --r:10px;--btn-text:#0D1007;
}
/* ── BRAND THEME PRESETS — lahat light background, dark olive na accent/text (tugma sa logo) ── */
:root[data-theme="ivory"]{
  color-scheme:light;
  --grn:#B8933A;--grn-l:#8A6A1F;--grn-d:#14110C;--grn-bg:rgba(184,147,58,.11);--grn-bd:rgba(184,147,58,.38);
  --bg:#FBF8F1;--s1:#FFFFFF;--s2:#F7F0E1;--s3:#F3E7CC;--mid:#EADCBC;--bd:#E8DDC5;--bdl:#DCCCA6;
  --wh:#14110C;--mt:#6F6556;--red:#A93226;--gold:#B8933A;--cream:#14110C;--btn-text:#FFFDF7;
  --sh:0 1px 2px rgba(65,65,36,.06),0 8px 24px -12px rgba(65,65,36,.18);
}
:root[data-theme="sand"]{
  color-scheme:light;
  --grn:#B8933A;--grn-l:#8A6A1F;--grn-d:#14110C;--grn-bg:rgba(184,147,58,.11);--grn-bd:rgba(184,147,58,.38);
  --bg:#FBF8F1;--s1:#FFFFFF;--s2:#F7F0E1;--s3:#F3E7CC;--mid:#EADCBC;--bd:#E8DDC5;--bdl:#DCCCA6;
  --wh:#14110C;--mt:#6F6556;--red:#A93226;--gold:#B8933A;--cream:#14110C;--btn-text:#FFFDF7;
  --sh:0 1px 2px rgba(65,65,36,.07),0 8px 24px -12px rgba(65,65,36,.2);
}
:root[data-theme="beige"]{
  color-scheme:light;
  --grn:#B8933A;--grn-l:#8A6A1F;--grn-d:#14110C;--grn-bg:rgba(184,147,58,.11);--grn-bd:rgba(184,147,58,.38);
  --bg:#FBF8F1;--s1:#FFFFFF;--s2:#F7F0E1;--s3:#F3E7CC;--mid:#EADCBC;--bd:#E8DDC5;--bdl:#DCCCA6;
  --wh:#14110C;--mt:#6F6556;--red:#A93226;--gold:#B8933A;--cream:#14110C;--btn-text:#FFFDF7;
  --sh:0 1px 2px rgba(65,65,36,.08),0 8px 24px -12px rgba(65,65,36,.22);
}
html,body{overflow-x:hidden;max-width:100vw}
body{font-family:'Jost',system-ui,sans-serif;background:
  radial-gradient(1200px 500px at 15% -10%,rgba(184,147,58,.10),transparent 60%),
  radial-gradient(900px 400px at 90% 0%,rgba(201,168,76,.07),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--wh);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:.005em}

/* Header */
.hdr{background:rgba(20,17,12,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:66px;position:sticky;top:0;z-index:50}
.notif-badge{position:absolute;top:-5px;right:-5px;background:#e5484d;color:#fff;border-radius:50%;min-width:17px;height:17px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px var(--s1)}
.notif-bell{width:36px;height:36px;padding:0!important;border-radius:50%!important;display:inline-flex;align-items:center;justify-content:center;font-size:16px!important;letter-spacing:0!important;text-transform:none!important}
.msngr-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.msngr-hint{font-size:11px;color:var(--mt);margin-top:8px;text-align:center}
/* Calendar View (month grid) */
.cv-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cv-title{font-family:Georgia,'Times New Roman',serif;font-weight:300;font-size:26px;color:var(--wh)}
.cv-hint{font-size:11px;color:var(--mt);margin-bottom:12px;text-align:center;padding:8px;background:var(--s2);border-radius:8px;border:1px solid var(--bd)}
.cv-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.cv-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:10px}
.cv-weekday{text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mt);text-transform:uppercase}
.cv-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cv-cell{min-height:96px;min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s;cursor:pointer;overflow:hidden}
.calview-split{display:flex;gap:18px;align-items:flex-start}
.calview-left{flex:1.3;min-width:0}
.calview-right{flex:1;min-width:0;position:sticky;top:112px;max-height:calc(100vh - 130px);overflow-y:auto;border-left:1px solid var(--bd);padding-left:18px}
.cv-right-hdr{font-family:Georgia,'Times New Roman',serif;font-weight:300;font-size:19px;color:var(--wh)}
.cv-right-hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cv-selected{border-color:var(--grn-l)!important;box-shadow:0 0 0 1px var(--grn-l) inset}
.cv-count{font-size:9px;color:var(--grn-l);font-weight:700}
.cv-count.cv-ghl{color:var(--gold)}
.cv-dow-mobile{display:none}
.cv-ghl-list{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cv-ghl-ev{font-size:9px;color:var(--gold);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-ghl-more{font-size:9px;color:var(--mt);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.cv-ghl-more:hover{color:var(--grn-l)}
.cv-cell.cv-other{opacity:.25}
.cv-cell:hover{border-color:var(--bdl)}
.cv-cell.cv-today{border-color:var(--grn-l)}
.cv-daytop{display:flex;align-items:center;justify-content:space-between}
.cv-daynum{font-size:12px;font-weight:600;color:var(--mt)}
.cv-cell.cv-today .cv-daynum{color:var(--grn-l);font-weight:800}
.cv-addbtn{width:18px;height:18px;border-radius:50%;border:1px solid var(--bdl);background:transparent;color:var(--mt);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.cv-cell:hover .cv-addbtn{opacity:1}
.cv-events{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cv-event{background:var(--grn-bg);border:1px solid var(--grn-bd);border-left:3px solid var(--grn-l);color:var(--grn-l);padding:3px 5px;border-radius:3px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notif-panel{position:fixed;top:66px;right:22px;width:300px;max-height:400px;overflow-y:auto;background:var(--s2);border:1px solid var(--bd);border-radius:12px;box-shadow:0 20px 50px -20px #000;z-index:60;padding:10px}
.notif-empty{color:var(--mt);font-size:12px;text-align:center;padding:20px 10px}
.notif-card{background:var(--s1);border:1px solid var(--bd);border-radius:9px;padding:10px;margin-bottom:8px}
.notif-card:last-child{margin-bottom:0}
.notif-name{font-size:12.5px;font-weight:600;color:var(--cream)}
.notif-link{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(127,127,100,.4);text-underline-offset:3px}
.csearch{position:relative;flex:1 1 240px;max-width:380px}
.csearch input{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--s1);color:var(--cream);font-size:13px;font-family:inherit;outline:none}
.csearch input:focus{border-color:var(--gold,#B8860B)}
.csr-box{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--s1);border:1px solid var(--bd);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);max-height:360px;overflow-y:auto;padding:4px}
.csr-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--cream);cursor:pointer}
.csr-row:hover{background:var(--s2)}
.csr-row.past{opacity:.6}
.csr-n{font-size:12.5px;font-weight:600}
.csr-d,.csr-s{font-size:11px;color:var(--mt)}
.csr-empty{padding:10px;font-size:11.5px;color:var(--mt);line-height:1.5}
@keyframes bkflash{0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,0)}30%,70%{box-shadow:0 0 0 4px rgba(184,134,11,.85)}}
.bk-flash{animation:bkflash 1.3s ease 2;z-index:5}
.notif-source{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:10px;margin-bottom:6px}
.notif-source-email{background:rgba(140,166,88,.15);border:1px solid rgba(168,190,114,.35);color:var(--grn-l)}
.notif-source-msg{background:rgba(90,130,200,.15);border:1px solid rgba(120,160,220,.35);color:#8fb4e8}
.notif-source-cal{background:rgba(212,170,80,.16);border:1px solid rgba(222,186,110,.4);color:#e2c27a}
.notif-source-verbal{background:rgba(200,110,90,.15);border:1px solid rgba(220,140,120,.38);color:#eaa28f}
.notif-detail{font-size:11px;opacity:.85;margin-top:2px;line-height:1.35}
.notif-inschedule{display:inline-block;margin-top:5px;font-size:10px;font-weight:700;color:var(--grn-l)}
.notif-phone{font-size:11px;color:var(--grn-l);margin-top:2px}
.notif-time{font-size:9.5px;color:var(--mt);margin-top:2px}
.notif-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:34px;width:auto;opacity:.97}
.brand-div{width:1px;height:22px;background:var(--bdl)}
.brand-sub{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.22em;font-weight:500;white-space:nowrap}

/* Tabs */
/* ── POS ────────────────────────────────────────────── */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
.pos-catalog{min-width:0}
.pos-toggle{display:flex;gap:6px;margin-bottom:14px}
.pos-toggle .chip{flex:1;text-align:center}
.pos-search{width:100%;background:var(--s2);border:1px solid var(--bd);color:var(--cream);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;margin-bottom:16px}
.pos-search::placeholder{color:var(--mt)}
.pos-catalog-scroll{max-height:calc(100vh - 260px);overflow-y:auto;padding-right:4px}
.pos-cat-label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--grn-l);font-weight:600;margin:16px 0 8px}
.pos-cat-label:first-child{margin-top:0}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pos-item{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:11px 13px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;color:inherit}
.pos-item:hover{border-color:var(--grn-bd);background:var(--grn-bg)}
.pos-item-oos{opacity:.4;cursor:not-allowed}
.pos-item-oos:hover{border-color:var(--bd);background:var(--s2)}
.pos-item-name{font-size:12px;font-weight:600;color:var(--cream);line-height:1.35}
.pos-item-name span{font-weight:400;color:var(--mt);font-size:10.5px}
.pos-item-price{font-size:12.5px;color:var(--grn-l);font-weight:700;margin-top:6px}
.pos-item-stock{font-size:9.5px;color:var(--mt);margin-top:3px}
.pos-empty{text-align:center;color:var(--mt);font-size:12px;padding:36px 12px}

.pos-cart{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:18px;position:sticky;top:130px;box-shadow:var(--sh)}
.pos-cart-hdr{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:var(--cream);margin-bottom:14px}
.pos-cart-lines{max-height:320px;overflow-y:auto;margin-bottom:14px}
.pos-line{background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;margin-bottom:8px}
.pos-line:last-child{margin-bottom:0}
.pos-line-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pos-line-name{font-size:12px;font-weight:600;color:var(--cream);line-height:1.35}
.pos-line-remove{background:none;border:none;color:var(--mt);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex-shrink:0}
.pos-line-remove:hover{color:#e08a72}
.pos-line-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap}
.pos-qty{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:3px 8px}
.pos-qty button{background:none;border:none;color:var(--grn-l);cursor:pointer;font-size:13px;font-weight:700;padding:0 2px}
.pos-qty span{font-size:12px;color:var(--cream);min-width:14px;text-align:center}
.pos-line-bottom select{background:var(--s1);border:1px solid var(--bd);color:var(--cream);border-radius:6px;padding:5px 7px;font-size:10.5px;font-family:inherit;flex:1;min-width:110px}
.pos-line-price{font-size:12.5px;color:var(--grn-l);font-weight:700;white-space:nowrap}
.pos-cart-totals{border-top:1px solid var(--bd);padding-top:12px;margin-bottom:14px}
.pos-total-row{display:flex;justify-content:space-between;font-size:12px;color:var(--mt);padding:3px 0}
.pos-total-row b{font-size:17px;color:var(--cream)}
.pos-total-row.pos-comm span:last-child{color:var(--grn-l);font-weight:600}
.pos-hint{font-size:10.5px;color:#e0b872;margin-top:8px;text-align:center}

@media (max-width:820px){
  .pos-layout{grid-template-columns:1fr}
  .pos-cart{position:static}
  .pos-catalog-scroll{max-height:none}
}

.tabs{background:rgba(20,17,12,.92);border-bottom:1px solid var(--bd);display:flex;padding:0 22px;gap:4px;position:sticky;top:66px;z-index:49;backdrop-filter:blur(14px);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;white-space:nowrap}
.tab{padding:13px 4px;margin-right:22px;font-size:11px;font-weight:500;color:var(--mt);cursor:pointer;border-bottom:1.5px solid transparent;text-transform:uppercase;letter-spacing:.14em;transition:color .18s,border-color .18s}
.tab:hover{color:var(--cream)}
.tab.on{color:var(--grn-l);border-bottom-color:var(--grn-l)}

.main{padding:26px 22px 60px;max-width:1560px;margin:0 auto}

/* Date bar */
.dbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.dlbl{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:500;letter-spacing:.01em;line-height:1.15}
.dlbl em{color:var(--grn-l);font-style:normal}
input[type=date]{background:var(--s2);border:1px solid var(--bd);color:var(--cream);padding:9px 12px;border-radius:8px;font-size:12px;font-family:inherit;box-shadow:var(--sh);color-scheme:light dark}
input[type=date]:focus{outline:none;border-color:var(--grn-d)}

/* Stat pills */
.pills{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pill{position:relative;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--bd);border-radius:var(--r);padding:13px 20px 12px;min-width:132px;box-shadow:var(--sh);overflow:hidden}
.pill:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--grn-l),var(--grn-d))}
.pv{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;font-weight:600;line-height:1.1}
.pv.g{color:var(--grn-l)}
.pl{font-size:9px;color:var(--mt);margin-top:5px;text-transform:uppercase;letter-spacing:.16em;font-weight:500}

/* Staff filter chips */
.staff-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--s2);border:1px solid var(--bd);color:var(--mt);padding:6px 12px;border-radius:20px;font-size:10.5px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.02em;font-family:inherit}
.chip:hover{border-color:var(--mid);color:var(--cream)}
.chip-on{background:var(--grn-bg);border-color:var(--grn-bd);color:var(--grn-l)}
.room-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid var(--bd);font-family:inherit}
.room-chip-free{background:rgba(107,127,62,.10);border-color:rgba(168,190,114,.28);color:var(--mt)}
.room-chip-busy{background:rgba(192,57,43,.16);border-color:var(--red);color:#E8A79C}
.staff-chip{background:transparent;border:1.5px solid rgba(168,190,114,.32);color:var(--mt);padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.staff-chip-on{border-color:var(--grn-l);color:var(--wh)}

/* Day lock */
.lock-badge{background:rgba(200,80,60,.15);border:1px solid rgba(200,80,60,.4);color:#e08a72;padding:6px 12px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.lock-btn{background:rgba(200,80,60,.1);border-color:rgba(200,80,60,.3);color:#e08a72}
.lock-btn:hover{border-color:#e08a72;color:#e08a72}
.sc.locked,.sc.bkd.locked{opacity:.55;cursor:not-allowed}
.sc.locked .ad{color:var(--mt)}
.pin-modal{max-width:360px}
.pin-txt{font-size:12px;color:var(--mt);line-height:1.6;margin-bottom:4px}
.pin-err{color:#e08a72;font-size:11px;margin-top:6px}
.pin-ok{color:#a8be72;font-size:11px;margin-top:6px}
.amend-notice{background:rgba(200,150,60,.1);border:1px solid rgba(200,150,60,.35);border-radius:10px;padding:12px;margin-bottom:16px}
.amend-title{font-size:12px;font-weight:600;color:#e0b872;margin-bottom:6px}
.amend-notice .fld{margin-top:10px;margin-bottom:0}
.orig-box{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-top:10px}
.orig-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--mt);margin-bottom:6px}
.orig-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--cream)}
.orig-row span{color:var(--mt)}
.amend-badge{background:rgba(200,150,60,.15);border:1px solid rgba(200,150,60,.4);color:#e0b872;padding:3px 8px;border-radius:12px;font-size:9.5px;font-weight:600;white-space:nowrap}

/* Board */
.bwrap{overflow-x:auto;border-radius:14px;box-shadow:0 20px 50px -30px #000}
.board{min-width:960px;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--bg)}
.brow{display:grid;border-bottom:1px solid var(--bd)}
.brow:last-child{border-bottom:none}
.brow:first-child{position:sticky;top:0;z-index:5}
.th-t{padding:12px 10px;font-size:9px;color:var(--mt);border-right:1px solid var(--bd);text-transform:uppercase;letter-spacing:.16em;background:var(--s2);white-space:nowrap;display:flex;align-items:center;min-width:0}
.th-s{padding:11px 6px;text-align:center;border-right:1px solid var(--bd);background:var(--s2);min-width:0}
.th-s:last-child{border-right:none}
.sn{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--cream)}
.sr{font-size:8px;color:var(--grn-l);margin-top:3px;text-transform:uppercase;letter-spacing:.14em}
.tc{padding:5px 10px;font-size:10px;color:var(--mt);border-right:1px solid var(--bd);display:flex;align-items:center;min-height:44px;white-space:nowrap;background:var(--s1);font-variant-numeric:tabular-nums;letter-spacing:.04em;min-width:0}

.tl-facial{background:#F7E3C0;border-color:#B7791F;color:#5E3B0C}

.tl-body-svc{background:#D6ECE3;border-color:#2E7D62;color:#174537}

/* Modal */

.ex-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.ex-row input{flex:1;min-width:0}.ex-row input.ex-price{flex:0 0 90px}

/* Sections & tables */

// COMMISSION FORMULA HISTORY (kept for reference — do not delete)
// ──────────────────────────────────────────────────────────────────────
// FORMULA 1 (NUTOPIA) — used in v16 through v20, now retired:
//   Cash and Card were tracked as TWO FULLY SEPARATE buckets. Each bucket
//   looked up its OWN bracket % from its OWN gross total, independently:
//     cashComm = cashGross × 0.88        × bracketRate(cashGross)
//     cardComm = cardGross × 0.848232    × bracketRate(cardGross)
//     total    = cashComm + cardComm
//   Problem this caused: a staff could do e.g. ₱3,900 Cash + ₱3,800 Card
//   in one day (₱7,700 total work) and earn ₱0, because NEITHER bucket
//   alone crossed the ₱4,000 threshold on its own. Boss flagged this as
//   unfair (a fully-booked day could pay nothing).
//
// FORMULA 2 (CURRENT) — combined-bracket, separate net factor:
//   Cash and Card gross are ADDED TOGETHER first, and that COMBINED total
//   is what decides the bracket %. Each bucket still keeps its own net
//   factor when the % is actually applied:
//     rate     = bracketRate(cashGross + cardGross)
//     cashComm = cashGross × 0.88        × rate
//     cardComm = cardGross × 0.848232    × rate
//     total    = cashComm + cardComm
//   This is what computeCommissionBreakdownLive() below implements. It
//   also now folds in POS sales (getStaffGrossLines), not just Scheduler
//   bookings, per the same "don't shortchange a busy day" reasoning.
//
// If Formula 1 is ever needed again (e.g. boss changes his mind), swap
// the `rate` line in computeCommissionBreakdownLive back to two separate
// bracketRate() calls, one per bucket — see git-style diff in this
// comment block above for the exact shape.
// ══════════════════════════════════════════════════════════════════════
// ── COMPANY ASSET DEDUCTION (walang commission ang Sauna at Jacuzzi/Hydrotherapy) ──
// Ayon kay boss: company asset ang sauna at jacuzzi, kaya ang serbisyo lang ng staff
// ang may commission. Ibinabawas sa presyo bago kwentahin ang commission (per head):
//   Jacuzzi / Hydrotherapy (30 min) = ₱1,000   ·   Sauna (30 min) = ₱750
// Hal. "Hydrotherapy/Jacuzzi w/ Scrub & 1hr Massage" ₱2,500 → ₱1,500 ang commissionable.
// Buong presyo pa rin ang papasok sa sales. Para sa mga araw simula ASSET_RULE_FROM lang.
const ASSET_RULE_FROM="2000-01-01"; // ayon kay boss: ilapat sa LAHAT ng araw, kasama ang mga nakaraan
const ASSET_DEDUCT={jacuzzi:1000,sauna:750};
function assetDeduction(svcId,dateStr){
  if((dateStr||today)<ASSET_RULE_FROM)return 0;
  const sv=svcs.find(x=>x.id===Number(svcId));
  if(!sv)return 0;
  const n=sv.name.toLowerCase();
  let d=0;
  if(/jacuzzi|hydrotherapy/.test(n))d+=ASSET_DEDUCT.jacuzzi;
  if(/sauna/.test(n)||/majestic/.test(n))d+=ASSET_DEDUCT.sauna; // Spa Party Majestic: may 30-min Sauna Therapy kada tao
  return d;
}
function commissionable(price,svcId,dateStr){return Math.max(0,(Number(price)||0)-assetDeduction(svcId,dateStr));}
// Kapag buong package ang presyo (hal. POS line ng Couple Package na 2 pax), ibawas para sa bawat tao
function assetDeductionFull(svcId,dateStr){const sv=svcs.find(x=>x.id===Number(svcId));return assetDeduction(svcId,dateStr)*(sv?paxCountFor(sv):1);}
function getStaffGrossLines(staffId,dateStr,excludeBookingIds){
  const lines=[];
  bookings.filter(b=>b.date===dateStr&&Number(b.staffId)===Number(staffId)&&!(excludeBookingIds||[]).includes(b.id))
    .forEach(b=>lines.push({price:commissionable(b.price,b.svcId,dateStr)+extrasTotal(b),payMethod:b.payMethod}));
  // Ang POS sale na naka-link na sa booking ay nasa booking na — huwag nang bilangin ulit
  sales.filter(s=>s.date===dateStr&&!s.linkedBookingId).forEach(s=>{
    s.lines.filter(l=>l.type==='service'&&Number(l.staffId)===Number(staffId))
      .forEach(l=>lines.push({price:Math.max(0,(l.price-assetDeductionFull(l.refId,dateStr))*l.qty),payMethod:s.payMethod}));
  });
  return lines;
}
let allowanceHistory=[]; // [{staffId,effectiveDate,amount}] — para tama ang PAST payroll kahit magbago ang rate mamaya
// Allowance ng isang araw na pumasok: bracket = Daily Allowance · fixed = "bawi" lang kapag kulang sa min ang commission
function dayAllowance(staffId,dateStr){
  const g=staffGroupOn(staffId,dateStr);
  if(g==="bracket")return allowanceForDate(staffId,dateStr);
  const c=commGroupCfg[g];
  return (staffCommissionBreakdown(staffId,dateStr).bracket||0)<(Number(c.min)||0)?(Number(c.bawi)||0):0;
}
// Base ng late/OT kada araw (÷8 oras). Fixed: ang "bawi" (hal. ₱200), HINDI ang commission.
function lateBaseFor(staffId,dateStr){
  const g=staffGroupOn(staffId,dateStr);
  return g==="bracket"?allowanceForDate(staffId,dateStr):(Number(commGroupCfg[g].bawi)||0);
}
function allowanceForDate(staffId,dateStr){
  const entries=allowanceHistory.filter(h=>String(h.staffId)===String(staffId)&&h.effectiveDate<=dateStr);
  if(entries.length===0){
    const st=staff.find(s=>s.id===Number(staffId));
    return st?(st.dailyAllowance||0):0; // wala pang naitalang history bago ang petsang ito — gamitin ang current bilang baseline
  }
  entries.sort((a,b)=>a.effectiveDate<b.effectiveDate?1:-1); // pinaka-huling effectiveDate na <= dateStr
  return Number(entries[0].amount)||0;
}
function computeCommissionBreakdownLive(staffId,dateStr){
  const st=staff.find(s=>s.id===Number(staffId));
  const dayLines=getStaffGrossLines(staffId,dateStr);
  const cashGross=dayLines.filter(l=>!isCardPay(l.payMethod)).reduce((s,l)=>s+l.price,0);
  const cardGross=dayLines.filter(l=>isCardPay(l.payMethod)).reduce((s,l)=>s+l.price,0);
  const combinedGross=cashGross+cardGross;
  const grp=staffGroupOn(staffId,dateStr);
  const rate=(grp==="bracket"?bracketRate(combinedGross):Number(commGroupCfg[grp].rate)||0)/100; // bracket: ONE rate mula sa combined total · fixed: laging pareho
  const cashComm=cashGross*CASH_NET_FACTOR*rate;       // but each bucket keeps its own net factor
  const cardComm=cardGross*NONCASH_NET_FACTOR*rate;
  const bracket=Math.round(cashComm+cardComm);
  // Ayon kay boss: HINDI kasama ang daily allowance sa computation — mano-mano nila itong idinadagdag.
  return{bracket,allowance:0,total:bracket,combinedGross,rate:rate*100,group:grp,sales:staffSalesForDay(staffId,dateStr)};
}
// Kabuuang benta ng staff sa isang araw (buong presyo — scheduler bookings + POS service lines)
function staffSalesForDay(staffId,dateStr){
  let sum=0;
  bookings.filter(b=>b.date===dateStr&&Number(b.staffId)===Number(staffId)).forEach(b=>{sum+=bookingTotal(b);});
  sales.filter(x=>x.date===dateStr&&!x.linkedBookingId).forEach(x=>{
    (x.lines||[]).filter(l=>l.type==='service'&&Number(l.staffId)===Number(staffId)).forEach(l=>{sum+=(Number(l.price)||0)*(Number(l.qty)||1);});
  });
  return Math.round(sum);
}
function computeStaffDailyCommissionLive(staffId,dateStr){

// ── "A ✓" — may assessment na ang client (galing sa Assessments sheet: pangalan/phone/email lang) ──

  const pool=assessedItems.filter(a=>(a.d<=b.date&&a.d>=lo)||(a.sd&&a.sd<=b.date&&a.sd>=lo));
  if(!pool.length)return null;
  if(!isUnnamedGuest(b)){
    const ph=String(b.mobile||"").replace(/\D/g,"").slice(-10),em=String(b.email||"").trim().toLowerCase(),nm=_nmA(b.client);
    const hit=pool.find(a=>!a.g&&((ph.length===10&&a.p===ph)||(em&&a.e===em)))||pool.find(a=>nm&&_nmA(a.n)===nm);
    if(hit)return hit;
    if(!isGuestRow(b))return null;

  // ang mga kasamang may pangalan at tumugma na sa sariling form ay hindi na kukuha ng "Guest of" na form

  return idx>=0&&idx<gForms.length?gForms[idx]:null;
}

// Point-in-time check used by the board — is this slot's start time sitting
// inside another booking's busy window (duration + break), even though no
// booking literally starts here? Used to visually block those cells too.
// Generic Slot view — hindi nakatali sa pangalan ang column, "capacity slot"
// lang (Stylist 1, 2, 3...). Bawat booking, awtomatikong ipapasok sa unang
// slot na libre na sa oras na iyon (greedy interval packing, parehong
// lohika ng "day view" ng mga calendar app).
function assignGenericSlots(dayBookings){
  const sorted=[...dayBookings].sort((a,b)=>bookingOcc(a)[0]-bookingOcc(b)[0]);
  const slotFreeAt=[];
  const slotLast=[]; // huling booking sa bawat slot (para sa kasunod na service)
  const assignment={};
  sorted.forEach(b=>{
    const[start,occEnd]=bookingOcc(b);
    const end=occEnd+BREAK_MIN;
    let placed=false;
    // Kasunod na service (🔗 2nd svc): ilagay sa PAREHONG slot ng naunang service ng client, walang pahinga sa pagitan
    if(chainNo(b)>1){
      for(let i=0;i<slotLast.length;i++){
        const L=slotLast[i];
        if(L&&L.b.client===b.client&&String(L.b.staffId||"")===String(b.staffId||"")&&L.occEnd<=start){
          assignment[b.id]=i;slotFreeAt[i]=end;slotLast[i]={b,occEnd};placed=true;break;
        }
      }
      if(placed)return;
    }
    for(let i=0;i<slotFreeAt.length;i++){
      if(slotFreeAt[i]<=start){
        assignment[b.id]=i;
        slotFreeAt[i]=end;
        slotLast[i]={b,occEnd};
        placed=true;
        break;
      }
    }
    if(!placed){
      assignment[b.id]=slotFreeAt.length;
      slotFreeAt.push(end);
      slotLast.push({b,occEnd});
    }
  });
  return{assignment,slotCount:slotFreeAt.length};
}
function genericSlotCellInfo(dayBookings,assignment,slotIndex,timeVal){
  const t=timeToMin(timeVal);
  for(const b of dayBookings){
    if(assignment[b.id]!==slotIndex)continue;
    const start=timeToMin(b.time);
    const end=start+svcDur(b.svcId)+BREAK_MIN;
    if(t>=start&&t<end)return{booking:b,isStart:t===start};
  }
  return null;
}

  extraPrice=commissionable(extraPrice,extraSvcId,dateStr);

  const cashGross=dayLines.filter(l=>!isCardPay(l.payMethod)).reduce((s,l)=>s+l.price,0)+(extraPayMethod&&!isCardPay(extraPayMethod)?extraPrice:0);
  const cardGross=dayLines.filter(l=>isCardPay(l.payMethod)).reduce((s,l)=>s+l.price,0)+(isCardPay(extraPayMethod)?extraPrice:0);
  const grp=staffGroupOn(staffId,dateStr);
  const rate=(grp==="bracket"?bracketRate(cashGross+cardGross):Number(commGroupCfg[grp].rate)||0)/100;
  const cashComm=cashGross*CASH_NET_FACTOR*rate;

let staffLoadStatus="loading"; // loading | ok | empty | error — para makita agad kung successful ba talaga ang fetch mula sa Sheets
async function loadStaff(){
  loadStaffLocal();
  try{
    const res=await fetch(SHEET_URL+"?action=getStaff");
    const data=await res.json();
    if(data&&data.staff&&data.staff.length){
      // Kung may duplicate rows ang parehong staff sa Sheet, isa lang ang gagamitin: yung pinakabago
      const byId={};
      data.staff.forEach((row,i)=>{
        const k=String(row.id);
        const t=Date.parse(row.lastUpdatedAt||"")||0;
        const old=byId[k];
        if(!old||t>=old._t)byId[k]={...row,_t:t,_i:i};
      });
      Object.values(byId).forEach(saved=>{
        if(parseBool(saved.deleted)){
          staff=staff.filter(s=>String(s.id)!==String(saved.id));
          return;
        }
        const idx=staff.findIndex(s=>String(s.id)===String(saved.id));
        let skillsArr=[];
        try{ skillsArr=JSON.parse(saved.skills||"[]"); }catch(e){}
        if(idx>-1){
          staff[idx]={...staff[idx],active:parseBool(saved.active),dailyAllowance:Number(saved.dailyAllowance)||0,skills:skillsArr.length?skillsArr:staff[idx].skills,shiftStart:saved.shiftStart||staff[idx].shiftStart||"",commGroup:saved.commGroup||staff[idx].commGroup||"bracket",commSince:saved.commSince!=null&&saved.commSince!==""?saved.commSince:(staff[idx].commSince||"")};
        } else {
          staff.push({id:Number(saved.id),name:saved.name,role:saved.role,active:parseBool(saved.active),dailyAllowance:Number(saved.dailyAllowance)||0,skills:skillsArr,shiftStart:saved.shiftStart||"",commGroup:saved.commGroup||"bracket",commSince:saved.commSince||""});
        }
      });
      saveStaffLocal();
      staffLoadStatus="ok";
      render();
    } else {
      staffLoadStatus="empty"; // successful ang connection, pero walang laman ang Staff sheet sa Sheets
      // SST: unang bukas — ilagay ang mga default na stylist sa Staff tab ng Sheet
      try{ for(const st of staff){ await syncStaff(st); } staffLoadStatus="ok"; }catch(e){}
      render();
    }
  }catch(e){
    staffLoadStatus="error"; // hindi na-reach ang Sheets — ang makikita lang ay yung local/cached values
    render();
  }
}

function completeSale(){
  if(!posCheckout||!posCheckout.payMethod)return;
  const total=cartTotal();
  const discPct=Number(posCheckout.discountPct)||0;
  const discFactor=1-discPct/100;
  const finalTotal=total*discFactor;
  const commission=cartCommissionTotal();
  const tendered=Number(posCheckout.tendered)||0;
  if(posCheckout.payMethod==="Cash"&&tendered<finalTotal)return;
  // Hard-block: kung naka-book na ang client na ito ngayong araw, at may service sa
  // cart (na hindi galing sa booking picker) na IBA sa booked service, huwag munang
  // ituloy ang checkout — kailangang ayusin muna sa Scheduler para hindi doble
  // ang revenue record ng parehong client.
  const nameKey=(posCheckout.customerName||"").trim().toLowerCase();
  if(nameKey){
    const matchedBooking=bookings.find(b=>b.date===selDate&&b.client&&b.client.trim().toLowerCase()===nameKey);
    if(matchedBooking){
      const mismatch=cart.find(c=>c.type==="service"&&!c.fromBookingId&&c.refId!==matchedBooking.svcId);
      if(mismatch){
        checkoutBlock={bookingId:matchedBooking.id,cartLineName:mismatch.name};
        render();
        return;
      }
    }
  }
  if(!timeInGuardPos())return;
  const linkedLines=cart.filter(c=>c.fromBookingId);
  const newLines=cart.filter(c=>!c.fromBookingId);
  // Linked lines: their revenue already lives in "Bookings" — just sync the payment
  // method onto the original booking so it counts correctly, don't record it again.
  linkedLines.forEach(c=>{
    bookings=bookings.map(b=>b.id===c.fromBookingId?{...b,payMethod:posCheckout.payMethod,amtPaid:Math.round(bookingGross(b)*discFactor),discountPct:discPct,posPaid:true,notes:addPosMark(b.notes)}:b);
    const bk=bookings.find(b=>b.id===c.fromBookingId);
    if(bk)syncBooking(bk,"upsert");
  });
  const newTotal=newLines.reduce((s,c)=>s+c.price*c.qty,0)*discFactor;
  if(newLines.length>0){
    const sale={
      id:Date.now(),date:selDate,
      lines:newLines.map(c=>({type:c.type,refId:c.refId,name:c.name,price:c.price,qty:c.qty,staffId:c.staffId||"",staffName:c.staffId?(staff.find(s=>s.id===Number(c.staffId))?.name||""):""})),
      total:newTotal,subtotal:newLines.reduce((s,c)=>s+c.price*c.qty,0),commission,payMethod:posCheckout.payMethod,
      tendered:posCheckout.payMethod==="Cash"?tendered:newTotal,
      change:posCheckout.payMethod==="Cash"?Math.max(0,tendered-finalTotal):0,
      customerName:posCheckout.customerName||"",customerEmail:posCheckout.customerEmail||"",
      discountPct:discPct
    };
    sales=[sale,...sales];
    syncSale(sale);
  }
  products=products.map(p=>{
    const line=cart.find(c=>c.type==="product"&&c.refId===p.id);
    return line?{...p,stock:Math.max(0,p.stock-line.qty)}:p;
  });
  receiptData={
    id:Date.now(),date:selDate,
    lines:cart.map(c=>({name:c.name,price:c.price,qty:c.qty})),
    total:finalTotal,subtotal:total,discountPct:discPct,payMethod:posCheckout.payMethod,
    tendered:posCheckout.payMethod==="Cash"?tendered:finalTotal,
    change:posCheckout.payMethod==="Cash"?Math.max(0,tendered-finalTotal):0,
    customerName:posCheckout.customerName||"",customerEmail:posCheckout.customerEmail||""
  };
  cart=[];posCheckout=null;render();
}

const BASIC_FACIALS=["Express Facial","Prestige Essential Facial","Eye Contour","White and Glow","Illuminating (Glow)","Nourishing (Acne Treatment)","Collagen Enriching Facial"];
function staffCanDoService(staffId,svcId){
  const st=staff.find(s=>s.id===Number(staffId));
  const sv=svcs.find(s=>s.id===Number(svcId));
  if(!st||!sv)return true; // wala pang napipili, huwag munang i-restrict
  const sk=st.skills||[];
  if(sk.length===0)return true; // walang naka-configure na skills, huwag i-restrict (backward compatible)
  if(sv.cat==="Therapeutic Massage")return sk.includes("massage");
  if(sv.cat==="Facial Treatment")return sk.includes("facial")||(sk.includes("facial-basic")&&BASIC_FACIALS.includes(sv.name));
  if(sv.cat==="Nail Care & Grooming")return sk.includes("nails");
  if(sv.name.startsWith("Waxing - "))return sk.includes("waxing")||(sk.includes("waxing-basic")&&sv.name==="Waxing - Underarm");
  if(sv.name.startsWith("Bleaching - "))return sk.includes("bleaching");
  if(sv.name.startsWith("RF Treatment - "))return sk.includes("RF");
  return true; // ibang categories (Hand & Foot, Scrubs & Sauna, Body Treatment, Promos, Eyelash, Gluta) — wala pang naka-configure na restriction
}

// ══ COMPACT TIMELINE ══════════════════════════════════════
// Isang row bawat ORAS (80px), at ang bawat booking ay block na ang taas
// ay katumbas ng tagal ng service. Pag-click sa bakanteng puwang = New
// Booking sa pinakamalapit na 15 minuto.
const TL_START=9*60,TL_END=DAY_END_MIN,TL_PPM=80/60;
const TL_H=(TL_END-TL_START)*TL_PPM;
function tlCat(b){
  if(b.homeService)return"home";
  const sv=svcs.find(x=>x.id===b.svcId);const c=sv?sv.cat:"";
  const k=sv&&sv.legacy?sv.oc:c;
  if(k==="Haircuts & Styles"||k==="Haircut & Style"||k==="Others")return"massage";
  if(k==="Blowout & Styles"||k==="Blowout & Style")return"facial";
  if(k==="Highlights & Coloring"||k==="Color & Highlights")return"nails";
  if(k==="Hair Treatments"||k==="Scalp Treatments"||k==="Specialty Services")return"body-svc";
  if(k==="Nail Care & Spa"||k==="Thread / Wax")return"promo";
  if(k==="Promos & Packages")return sv.grp==="HC"?"facial":"body-svc";
  return"other";
}
function tlHourLbl(m){const h=Math.floor(m/60);if(h===12)return"12 NN";if(h===24||h===0)return"12 MN";if(h>24)return(h-24)+" AM";return(h>12?h-12:h)+(h>=12?" PM":" AM");}
function tlLanes(list){
  const items=list.map(b=>({b,occ:bookingOcc(b)})).sort((x,y)=>x.occ[0]-y.occ[0]);
  const laneEnd=[],laneLast=[],res={};
  items.forEach(it=>{
    let l=-1;
    // Kasunod na service ng parehong client: parehong lane, walang pahinga sa pagitan
    if(chainNo(it.b)>1)l=laneLast.findIndex((L,i)=>L&&L.b.client===it.b.client&&L.occ[1]<=it.occ[0]);
    if(l<0)l=laneEnd.findIndex(end=>end<=it.occ[0]);
    if(l<0){l=laneEnd.length;laneEnd.push(0);laneLast.push(null);}
    laneEnd[l]=it.occ[1]+BREAK_MIN;laneLast[l]=it;res[it.b.id]=l;
  });
  return{res,lanes:Math.max(1,laneEnd.length)};
}
function tlEsc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function tlBlock(b,lane,lanes,showStaff){
  const[st,en]=bookingOcc(b);
  const top=Math.max(0,(st-TL_START)*TL_PPM);
  const h=Math.max(22,(Math.min(en,TL_END)-Math.max(st,TL_START))*TL_PPM-3);
  const sv=svcs.find(x=>x.id===b.svcId);const stf=staff.find(x=>x.id===b.staffId);
  const pending=!b.staffId;const locked=isDayLocked(selDate);
  const click=locked?`openUnlockDialog('${selDate}')`:(b.locked?`openLockedBookingDialog(${b.id})`:`openEdit(${b.id})`);
  const w=100/lanes,left=lane*w;
  const pos=`left:calc(${left}% + 4px);width:calc(${w}% - 8px)`;
  const short=(en-st)<=35;
  const svcName=sv?sv.name+(sv.v?' · '+sv.v:''):'';
  const range=fmtHM(timeToMin(b.time))+"–"+fmtHM(timeToMin(b.time)+svcDur(b.svcId));
  const tip=`${b.client}${groupInfo(b)?' ('+groupInfo(b).i+'/'+groupInfo(b).n+')':''} — ${svcName} · ${range}${b.homeService?' · Home Service':''}`;
  return `<div class="tl-blk tl-${tlCat(b)}${pending?' tl-pending':''}" data-bk="${b.id}" style="--bi:${Math.min(12,Math.floor((st-TL_START)/60))};top:${top}px;height:${h}px;${pos}" onclick="event.stopPropagation();${click}" title="${tlEsc(tip)}">
    <div class="tl-badges">${assessBadge(b)}${paidBadge(b)}<button class="tl-lock" onclick="event.stopPropagation();toggleBookingLock(${b.id},event)" aria-label="${b.locked?'Unlock booking':'Lock booking'}">${b.locked?'🔒':'🔓'}</button></div>
    <div class="tl-name">${String(b.notes||"").includes("[Kiosk]")?`<span class="tl-kiosk">Kiosk</span>`:String(b.notes||"").includes("[GHL]")?`<span class="tl-kiosk" style="background:#3B5B92">GHL</span>`:""}${groupBadge(b)}${isUnnamedGuest(b)?`<span style="font-weight:600;opacity:.8">${tlEsc(clientLabel(b))}</span>`:tlEsc(b.client)}${short?' · '+tlEsc(sv?sv.name:''):''}</div>
    ${showStaff&&!short?`<div class="tl-line" style="font-weight:600${pending?';color:#B0392B':''}">${pending?'⚠️ Unassigned':(stf?tlEsc(stf.name):'—')}</div>`:''}
    ${!short?`<div class="tl-line">${b.homeService?'🏠 Home Service · ':''}${tlEsc(svcName)}</div>`:''}
    <div class="tl-meta">${short&&showStaff?(pending?'⚠️ Assign · ':(stf?tlEsc(stf.name)+' · ':'')):''}${range} · ${b.homeService&&Number(b.homeFee)>0?`${php(b.price)} + <b>${php(b.homeFee)} fee</b>`:php(bookingTotal(b))}${b.payMethod?' · '+b.payMethod:''}</div>
  </div>${en<TL_END&&!hasChainNext(b,en)?`<div class="tl-break" style="top:${(en-TL_START)*TL_PPM}px;height:${BREAK_MIN*TL_PPM-2}px;${pos}"></div>`:''}`;
}

// ── DRAG & DROP sa Schedule grid: pindutin nang matagal (touch) o hilahin (mouse) ang booking ──
// Pataas/pababa = ibang oras (15 min). Sa "By Name" view, pakaliwa/pakanan = ibang stylist.
// Kasama ang mga kasunod na service ng client ([Svc 2], [Svc 3]…). May tanong bago ilipat at "Undo".
let DRAG=null,_dragJustEnded=0,_dragUndo=null,_dragUndoTimer=null;
function dragItems(b){
  if(!chainNo(b))return[b];
  return sameClientDay(b).filter(x=>chainNo(x)>0).sort((x,y)=>timeToMin(x.time)-timeToMin(y.time));
}
function dragCheck(d,sid,delta){
  if(delta===0&&String(sid)===String(d.b.staffId||""))return{ok:false,same:true,msg:"Same time"};
  const ids=d.items.map(x=>x.id),saved=bookings;
  bookings=bookings.filter(x=>!ids.includes(x.id));
  try{
    for(const it of d.items){
      const nm=timeToMin(it.time)+delta;
      const occSt=bookingOcc(it)[0]+delta;
      if(occSt<TL_START||nm>DAY_END_MIN-15)return{ok:false,msg:"Outside opening hours"};
      const st=(d.named&&String(it.staffId||"")===String(d.b.staffId||""))?sid:it.staffId;
      const tv=minToTimeVal(nm),dur=svcDur(it.svcId)+(it.homeService?(Number(it.travelMin)||0)*2:0);
      if(st&&!isSlotFree(Number(st),it.date,minToTimeVal(occSt),dur))return{ok:false,msg:"Fully booked: "+((staff.find(x=>x.id===Number(st))||{}).name||"stylist")+" ("+staffCap(st)+" client)"};
      for(const r of [it.room,it.room2])if(r&&!isRoomFree(r,it.date,tv,svcDur(it.svcId)))return{ok:false,msg:"Full: "+(roomLabel(r)||"room")};
    }
    return{ok:true};
  }finally{bookings=saved;}
}
// Slot view: mga stylist na bakante sa bagong oras (para sa listahang pipiliin)
function dragFreeTherapists(d,delta){
  const ids=d.items.map(x=>x.id),saved=bookings;
  bookings=bookings.filter(x=>!ids.includes(x.id));
  try{
    const moving=d.items.filter(it=>String(it.staffId||"")===String(d.b.staffId||"")||it.id===d.b.id);
    return schedulerStaff().filter(s=>moving.every(it=>{
      const occSt=bookingOcc(it)[0]+delta,dur=svcDur(it.svcId)+(it.homeService?(Number(it.travelMin)||0)*2:0);
      return isSlotFree(s.id,it.date,minToTimeVal(occSt),dur);
    }));
  }finally{bookings=saved;}
}
function dragPointerDown(ev){
  if(ev.button!==undefined&&ev.button!==0)return;
  const blk=ev.target.closest(".tl-blk");if(!blk||ev.target.closest("button"))return;
  if(tab!=="board"||isDayLocked(selDate))return;
  const b=bookings.find(x=>x.id===Number(blk.dataset.bk));if(!b||b.locked)return;
  const col=blk.closest(".tl-col");if(!col)return;
  const r=blk.getBoundingClientRect();
  DRAG={b,blk,col,items:dragItems(b),named:col.dataset.named==="1",sx:ev.clientX,sy:ev.clientY,x:ev.clientX,y:ev.clientY,
    offY:ev.clientY-r.top,w:r.width,h:r.height,touch:ev.pointerType!=="mouse",active:false,timer:null,target:null};
  if(DRAG.touch)DRAG.timer=setTimeout(()=>{if(DRAG&&!DRAG.active)dragStart();},380);
}
function dragStart(){
  const d=DRAG;d.active=true;
  if(navigator.vibrate)try{navigator.vibrate(20);}catch(e){}
  const g=d.blk.cloneNode(true);g.classList.add("tl-ghost");g.removeAttribute("onclick");
  g.style.cssText+=`;position:fixed;left:0;top:0;width:${d.w}px;height:${d.h}px;z-index:3000;pointer-events:none`;
  const tag=document.createElement("div");tag.className="tl-drag-tag";document.body.appendChild(tag);
  document.body.appendChild(g);d.ghost=g;d.tag=tag;
  d.items.forEach(it=>{const e=document.querySelector(`.tl-blk[data-bk="${it.id}"]`);if(e)e.classList.add("tl-dragging");});
  document.body.classList.add("tl-drag-on");
  dragMove();dragLoop();
}
function dragMove(){
  const d=DRAG;if(!d||!d.active)return;
  const el=document.elementFromPoint(d.x,d.y);
  let col=el&&el.closest?el.closest(".tl-col"):null;
  if(col&&!d.named&&col.dataset.named!=="0")col=null; // Slot view: ibang slot column = pipili ng stylist
  if(col&&d.named&&col.dataset.named!=="1")col=null;
  const placeTag=(x,y,bad)=>{d.tag.style.transform=`translate(${x}px,${Math.max(4,y-32)}px)`;d.tag.classList.toggle("bad",bad);};
  if(!col){d.target=null;d.ghost.style.transform=`translate(${d.x-d.w/2}px,${d.y-d.offY}px)`;d.ghost.classList.add("bad");d.tag.textContent="✕ Only on this schedule";placeTag(d.x-d.w/2,d.y-d.offY,true);return;}
  const cr=col.getBoundingClientRect();
  const occ0=bookingOcc(d.b)[0];
  let occ=TL_START+Math.round((d.y-d.offY-cr.top)/TL_PPM/15)*15;
  occ=Math.max(TL_START,Math.min(occ,DAY_END_MIN-15));
  const delta=occ-occ0,sid=d.named?col.dataset.sid:(d.b.staffId||"");
  const cross=!d.named&&col!==d.col;
  let chk;
  if(cross){
    const rc=dragCheck({...d,named:false,items:d.items.map(x=>({...x,staffId:0}))},"",delta); // room at oras lang
    const free=dragFreeTherapists(d,delta).filter(s=>String(s.id)!==String(d.b.staffId||""));
    chk=!rc.ok&&!rc.same?rc:(free.length?{ok:true,free}:{ok:false,msg:"No available stylist"});
  } else chk=dragCheck(d,sid,delta);
  d.target={col,delta,sid,ok:chk.ok,same:chk.same,cross,free:chk.free};
  d.ghost.style.transform=`translate(${cr.left+4}px,${cr.top+(occ-TL_START)*TL_PPM}px)`;
  d.ghost.style.width=Math.min(d.w,cr.width-8)+"px";
  d.ghost.classList.toggle("bad",!chk.ok&&!chk.same);d.ghost.classList.toggle("good",chk.ok);
  const st=staff.find(x=>String(x.id)===String(sid));
  d.tag.textContent=(chk.ok||chk.same?"":"✕ ")+fmtHM(timeToMin(d.b.time)+delta)+(cross&&chk.ok?" · choose a stylist ("+chk.free.length+" bakante)":"")+(d.named&&st?" · "+st.name:"")+(d.items.length>1?" (+"+(d.items.length-1)+" kasunod)":"")+(!chk.ok&&!chk.same?" — "+chk.msg:"");
  placeTag(cr.left+4,cr.top+(occ-TL_START)*TL_PPM,!chk.ok&&!chk.same);

function dragLoop(){
  const d=DRAG;if(!d||!d.active)return;
  const edge=60,sp=14;let moved=false;
  if(d.y<edge){window.scrollBy(0,-sp);moved=true;}else if(d.y>innerHeight-edge){window.scrollBy(0,sp);moved=true;}
  const bw=d.col.closest(".bwrap");
  if(bw&&d.named){const r=bw.getBoundingClientRect();if(d.x<r.left+40){bw.scrollLeft-=sp;moved=true;}else if(d.x>r.right-40){bw.scrollLeft+=sp;moved=true;}}
  if(moved)dragMove();
  requestAnimationFrame(dragLoop);
}
function dragPointerMove(ev){
  const d=DRAG;if(!d)return;
  d.x=ev.clientX;d.y=ev.clientY;
  const far=Math.abs(d.x-d.sx)+Math.abs(d.y-d.sy);
  if(!d.active){
    if(d.touch){if(far>10){clearTimeout(d.timer);DRAG=null;}return;} // nag-scroll lang
    if(far>6)dragStart();else return;
  }
  ev.preventDefault();dragMove();
}
function dragEnd(cancel){
  const d=DRAG;if(!d)return;clearTimeout(d.timer);DRAG=null;
  if(!d.active)return;
  _dragJustEnded=Date.now();
  if(d.ghost)d.ghost.remove();if(d.tag)d.tag.remove();
  document.body.classList.remove("tl-drag-on");
  document.querySelectorAll(".tl-dragging").forEach(e=>e.classList.remove("tl-dragging"));
  const t=d.target;
  if(cancel||!t||!t.ok)return;
  if(t.cross){dragPickTherapist(d,t);return;}
  dragApply(d,t);
}
function dragApply(d,t,picked){
  const b=d.b,st=staff.find(x=>String(x.id)===String(t.sid));
  const newT=fmtHM(timeToMin(b.time)+t.delta);
  const who=d.named&&String(t.sid)!==String(b.staffId||"")&&st?" kay "+st.name:"";
  let q=`Move ${clientLabel(b)} to ${newT}${who}?`;
  if(d.items.length>1)q+=`\n(Including ${d.items.length-1} follow-up service(s))`;
  if(d.items.some(isBookingPaid))q+="\n⚠️ This booking is already paid.";
  if(picked){if(d.items.some(isBookingPaid)&&!confirm(q))return;}else if(!confirm(q))return;
  const before=d.items.map(x=>({...x})),touched=new Set();
  d.items.forEach(it=>{
    const upd={...it,time:minToTimeVal(timeToMin(it.time)+t.delta)};
    if(d.named&&String(it.staffId||"")===String(b.staffId||""))upd.staffId=Number(t.sid)||0;
    if(String(upd.staffId||"")!==String(it.staffId||""))upd.notes=addThLog(it.notes,it.notes,thStamp()+" "+thWho()+" (drag): "+staffNameOf(it.staffId)+" → "+staffNameOf(upd.staffId));
    if(it.staffId)touched.add(it.staffId);if(upd.staffId)touched.add(upd.staffId);
    bookings=bookings.map(x=>x.id===it.id?upd:x);
    syncBooking(upd);
  });
  touched.forEach(sid=>{try{syncDailyCommission(sid,b.date);}catch(e){}});
  render();
  dragUndoToast(before,`Moved to ${newT}${who}`);
}

  const bg=document.createElement("div");bg.className="drag-pick-bg";
  bg.innerHTML=`<div class="drag-pick" role="dialog" aria-label="Choose a stylist">

    ${cur&&curOk&&t.delta!==0?`<button type="button" class="dp-keep" data-sid="${cur.id}">Time only — keep ${tlEsc(cur.name)}</button>`:""}
    <button type="button" class="dp-cancel">Cancel</button></div>`;
  document.body.appendChild(bg);

    close();

}
function dragUndoToast(before,msg){
  clearTimeout(_dragUndoTimer);_dragUndo=before;
  let el=document.getElementById("drag-undo");
  if(!el){el=document.createElement("div");el.id="drag-undo";document.body.appendChild(el);}
  el.innerHTML=`<span>✓ ${tlEsc(msg)}</span><button type="button" onclick="dragUndoNow()">↩ Undo</button>`;
  el.className="show";
  _dragUndoTimer=setTimeout(()=>{el.className="";_dragUndo=null;},10000);
}
function dragUndoNow(){
  const before=_dragUndo;if(!before)return;_dragUndo=null;clearTimeout(_dragUndoTimer);
  const touched=new Set();
  before.forEach(old=>{const cur=bookings.find(x=>x.id===old.id);if(cur&&cur.staffId)touched.add(cur.staffId);if(old.staffId)touched.add(old.staffId);
    bookings=bookings.map(x=>x.id===old.id?old:x);syncBooking(old);});
  touched.forEach(sid=>{try{syncDailyCommission(sid,before[0].date);}catch(e){}});
  const el=document.getElementById("drag-undo");if(el)el.className="";
  render();showSync("saved","↩ Naibalik");
}

function tlClick(ev,staffId){

  const r=ev.currentTarget.getBoundingClientRect();
  let m=TL_START+Math.floor((ev.clientY-r.top)/TL_PPM/15)*15;

function renderChangeOnly(){

function renderAgenda(){
  const tm=t=>timeToMin(t||"0:00");
  const list=db().slice().sort((a,b)=>tm(a.time)-tm(b.time)||String(a.client||"").localeCompare(String(b.client||"")));
  const locked=isDayLocked(selDate);
  const isToday=selDate===today;
  const n=new Date(),nowM=n.getHours()*60+n.getMinutes();
  if(!list.length){
    return `<div class="ag-empty"><div class="ag-empty-ico">🌿</div><b>No bookings on this day yet</b><span>Tap <b>＋ Booking</b> below to add one.</span></div>`;
  }
  const nowMark=`<div class="ag-now"><i></i><span>Now · ${fmtHM(nowM)}</span></div>`;
  let h=`<div class="ag${_mobAnimNow?' ag-anim':''}">`;
  let lastHr=null,i=0,nowPlaced=!isToday;
  list.forEach(b=>{
    const s0=tm(b.time),e0=s0+svcDur(b.svcId);
    if(!nowPlaced&&s0>nowM){h+=nowMark;nowPlaced=true;}
    const hr=Math.floor(s0/60);
    if(hr!==lastHr){const cnt=list.filter(x=>Math.floor(tm(x.time)/60)===hr).length;h+=`<div class="ag-hr"><span>${tlHourLbl(hr*60)}</span><em>${cnt} booking${cnt>1?'s':''}</em></div>`;lastHr=hr;}
    const sv=svcs.find(x=>x.id===b.svcId),stf=staff.find(x=>x.id===b.staffId);
    const svcName=sv?sv.name+(sv.v?' · '+sv.v:''):'—';
    const pending=!b.staffId;
    const click=locked?`openUnlockDialog('${selDate}')`:(b.locked?`openLockedBookingDialog(${b.id})`:`openEdit(${b.id})`);
    const status=isToday?(nowM>=e0?"done":nowM>=s0?"live":""):"";
    const notes=String(b.notes||"");
    const src=notes.includes("[Kiosk]")?`<span class="tl-kiosk">Kiosk</span>`:notes.includes("[GHL]")?`<span class="tl-kiosk" style="background:#3B5B92">GHL</span>`:"";
    const rooms=[b.room,b.room2].filter(Boolean).map(roomLabel).filter(Boolean).join(" + ");
    const st12=fmtHM(s0);
    h+=`<div class="ag-card${status?' ag-'+status:''}${pending?' ag-pend':''}${b.locked?' ag-locked':''}" data-bk="${b.id}" style="--c:${AG_COLORS[tlCat(b)]||'#8A8F6A'};--i:${Math.min(i++,14)}" onclick="${click}" onkeydown="if(event.key==='Enter')this.click()" role="button" tabindex="0" aria-label="${tlEsc(b.client)}, ${tlEsc(svcName)}, ${st12}">
      <div class="ag-time"><b>${st12.replace(/ (AM|PM)$/,'')}</b><span>${st12.slice(-2)}</span><em>${svcDur(b.svcId)} min</em><button type="button" class="ag-lock" onclick="event.stopPropagation();toggleBookingLock(${b.id},event)" aria-label="${b.locked?'Unlock booking':'Lock booking'}">${b.locked?'🔒':'🔓'}</button></div>
      <div class="ag-body">
        <div class="ag-top">
          <div class="ag-name">${src}${groupBadge(b)}${isUnnamedGuest(b)?`<span class="ag-guest">${tlEsc(clientLabel(b))}</span>`:tlEsc(b.client)}</div>
          <b class="ag-price">${php(bookingTotal(b))}</b>
        </div>
        <div class="ag-svc">${b.homeService?'🏠 Home Service · ':''}${tlEsc(svcName)}</div>
        <div class="ag-meta">${pending?'<span class="ag-warn">⚠️ Stylist not assigned yet</span>':`<span>👤 ${tlEsc(stf?stf.name:'—')}</span>`}${rooms?`<span>🚪 ${tlEsc(rooms)}</span>`:''}${b.payMethod?`<span>💳 ${tlEsc(b.payMethod)}</span>`:''}</div>
        <div class="ag-foot">
          <span class="ag-range">hanggang ${fmtHM(e0)}</span>
          <span class="ag-tags">${assessBadge(b)}${status==='live'?'<span class="ag-live"><i></i>Ongoing</span>':status==='done'?'<span class="ag-done">Done</span>':''}${isBookingPaid(b)?'<span class="ag-paid">✓ Paid</span>':''}</span>
        </div>
      </div>
    </div>`;
  });
  if(!nowPlaced)h+=nowMark;
  return h+`</div>`;
}

      });
    });
  });

// ── PERSISTENT MESSENGER IFRAME ──────────────────────────
// Kept OUTSIDE the normal render() innerHTML cycle so switching tabs never
// recreates/reloads the iframe — that was what forced GHL to ask to log in
// again every time. We set its src once, then just show/hide + reposition it.
let _msngrInited=false;
function positionMessenger(){
  const box=document.getElementById("msngr-persist");
  const iframe=document.getElementById("msngr-iframe");
  if(!box||!iframe)return;
  if(!_msngrInited){
    iframe.src=GHL_CONVO_URL;
    document.getElementById("msngr-open-link").href=GHL_CONVO_URL;
    _msngrInited=true;
  }
  if(tab==='messenger'){
    const hdr=document.querySelector(".hdr"),tabs=document.querySelector(".tabs");
    const top=(hdr?hdr.offsetHeight:66)+(tabs?tabs.offsetHeight:44);
    box.style.top=top+"px";
    box.style.display="flex";
  } else {
    box.style.display="none";
  }
}

function setTab(t){
  // Auto-logout settings when switching away
  if(tab==='settings'&&t!=='settings'){
    settingsUnlocked=false;
    clearTimeout(window._settingsTimer);
  }
  if(t==='settings'&&isAdmin()){settingsUnlocked=true;}
  if((t==='payroll')&&isAdmin()){commRevealed=true;}
  if(t==='settings'&&!settingsUnlocked){pinModal={mode:"settings",pin:"",error:false};render();return;}
  if(t==='payroll'&&!commRevealed){pinModal={mode:"commission",pin:"",error:false,next:"payroll"};render();return;}
  tab=t;render();
  if(t==='calview')loadGhlEvents();
  if(t==='settings'&&isAdmin())loadAdminData();
  if(t==='payroll'&&commRevealed)setTimeout(()=>syncCommissionRange(payrollStart,payrollEnd,true),500);
}

// ── STICKY NA PANGALAN NG THERAPIST + NAKATAGONG HEADER HABANG NAG-I-SCROLL ──
// 1) Kapag lumampas sa itaas ang hilera ng pangalan, may manipis na kopya nito na dumidikit sa itaas.
// (Ang dark header at mga tab ay kusa nang umaalis sa screen habang nag-i-scroll, kaya buo ang nakikita.)
let _tlBwrap=null;
function hdrOffset(){
  const t=document.querySelector(".tabs");
  if(t&&t.offsetParent!==null)return Math.max(0,t.getBoundingClientRect().bottom);
  const hd=document.querySelector(".hdr");return hd?Math.max(0,hd.getBoundingClientRect().bottom):0;
}
function tlFloatSync(rebuild){
  let fl=document.getElementById("tl-float");
  const head=document.querySelector(".tl-head"),tl=document.querySelector(".tl"),bw=document.querySelector(".bwrap");
  if(!head||!tl||!bw||modal){if(fl)fl.style.display="none";return;}
  if(!fl){fl=document.createElement("div");fl.id="tl-float";fl.innerHTML='<div class="tlf-in"></div>';document.body.appendChild(fl);}
  const inner=fl.firstChild;
  if(rebuild||!inner.firstChild){inner.innerHTML=head.outerHTML;}
  if(bw!==_tlBwrap){_tlBwrap=bw;bw.addEventListener("scroll",()=>tlFloatSync(false),{passive:true});}
  const top=hdrOffset(),hr=head.getBoundingClientRect(),tr=tl.getBoundingClientRect(),br=bw.getBoundingClientRect();
  const show=hr.top<top&&tr.bottom>top+60;
  fl.style.display=show?"block":"none";
  if(!show)return;
  fl.style.top=top+"px";fl.style.left=br.left+"px";fl.style.width=br.width+"px";
  inner.style.width=tl.offsetWidth+"px";inner.style.transform="translateX("+(-bw.scrollLeft)+"px)";
}
window.addEventListener("scroll",()=>{try{tlFloatSync(false);}catch(e){}},{passive:true});
window.addEventListener("resize",()=>{try{tlFloatSync(true);}catch(e){}});
// ── CLIENT SEARCH: hanapin ang booking ng client (lahat ng petsa) → dadalhin sa slot ──
let clientQuery="";
function clientMatches(b,q){
  q=String(q||"").trim().toLowerCase();if(!q)return false;
  const qd=q.replace(/\D/g,"");
  if(qd.length>=7){const bd=String(b.mobile||"").replace(/\D/g,"");return !!bd&&bd.slice(-10).includes(qd.slice(-10));}
  const name=String(b.client||"").toLowerCase();
  const toks=q.split(/[^a-z0-9ñ]+/i).filter(t=>t.length>=2);
  return toks.length?toks.every(t=>name.includes(t)):name.includes(q);
}
function clientResultsHtml(){
  if(!clientQuery.trim())return "";
  const list=bookings.filter(b=>clientMatches(b,clientQuery));
  if(!list.length)return `<div class="csr-box"><div class="csr-empty">No bookings found for "${tlEsc(clientQuery)}".<br>The client may not be in the scheduler yet.</div></div>`;
  const up=list.filter(b=>b.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time,undefined,{numeric:true}));
  const past=list.filter(b=>b.date<today).sort((a,b)=>b.date.localeCompare(a.date));
  const rows=[...up,...past].slice(0,10);
  return `<div class="csr-box">${rows.map(b=>{
    const sv=svcs.find(x=>x.id===b.svcId);const st=staff.find(x=>x.id===b.staffId);
    const d=new Date(b.date+"T00:00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric"});
    return `<button type="button" class="csr-row${b.date<today?' past':''}" onclick="goToBooking(${b.id})">
      <span class="csr-n">${groupBadge(b)}${tlEsc(b.client)}</span>
      <span class="csr-d">${d} · ${fmtHM(timeToMin(b.time))} · ${tlEsc(sv?sv.name:'—')}</span>
      <span class="csr-s">${b.staffId?(st?'👤 '+tlEsc(st.name):'👤 —'):'<b style="color:#B0392B">⚠️ Pending — not yet assigned</b>'}${b.date<today?' · done':''}</span>
    </button>`;}).join("")}${list.length>10?`<div class="csr-empty">+${list.length-10} more — type a more specific name or phone</div>`:''}</div>`;
}
function setClientQuery(v){clientQuery=v;const el=document.getElementById("csr");if(el)el.innerHTML=clientResultsHtml();}
function goToBooking(id){
  const b=bookings.find(x=>x.id===id);if(!b)return;
  clientQuery="";notifPanelOpen=false;selDate=b.date;tab="board";render();
  setTimeout(()=>{
    const el=document.querySelector('[data-bk="'+id+'"]');
    if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("bk-flash");setTimeout(()=>el.classList.remove("bk-flash"),2600);}
    else openEdit(id);
  },60);
}

const _rawFetch=window.fetch.bind(window);
window.fetch=async function(url,opts){
  const u=String(url);
  // SST TRIAL: wala pang backend — lokal lang ang data (sa browser na ito)
  if(!SHEET_URL&&(u.indexOf("?action=")===0||u===""||u.indexOf("http")!==0&&/^\?|^$/.test(u)))return new Response(JSON.stringify({status:"offline"}),{headers:{"Content-Type":"application/json"}});
  if(u.indexOf(SHEET_URL)!==0)return _rawFetch(url,opts);
  const tok=SESSION?SESSION.token:"";
  if(!opts||!opts.method||String(opts.method).toUpperCase()==="GET"){
    url=u+(u.indexOf("?")>=0?"&":"?")+"token="+encodeURIComponent(tok);
  }else if(opts.body){
    try{const b=JSON.parse(opts.body);if(b.action!=="login")b.token=tok;opts={...opts,body:JSON.stringify(b)};}catch(e){}
  }
  const res=await _rawFetch(url,opts);
  try{res.clone().json().then(j=>{if(j&&j.status==="auth")onAuthExpired();}).catch(()=>{});}catch(e){}
  return res;
};

// ── OFFLINE QUEUE ──────────────────────────────────────────
// Bago pa man subukang i-send papunta sa Google Sheets, laging isasave muna
// dito sa browser (localStorage). Kung successful ang pagpadala, tatanggalin
// dito. Kung nabigo (walang net), mananatili — awtomatikong susubukan ulit
// pag bumalik ang connection, kahit isara/buksan ulit ang app.
const PENDING_KEY="sst_pending_sync";
function getPendingQueue(){
  try{return JSON.parse(localStorage.getItem(PENDING_KEY)||"[]");}catch(e){return[];}
}
function savePendingQueue(q){
  try{localStorage.setItem(PENDING_KEY,JSON.stringify(q));}catch(e){}
  updateSyncBadge();
}
function queueUpsert(queueId,payload){
  const q=getPendingQueue().filter(item=>item.queueId!==queueId);
  q.push({queueId,payload,addedAt:Date.now()});
  savePendingQueue(q);
}
function queueRemove(queueId){
  savePendingQueue(getPendingQueue().filter(item=>item.queueId!==queueId));
}
async function sendPayload(payload){
  if(LOGIN_ENABLED&&!SESSION)return false; // naghihintay ng login — mananatili sa queue
  try{
    const res=await fetch(SHEET_URL,{method:"POST",body:JSON.stringify(payload)});
    const j=await res.json().catch(()=>null);
    if(j&&(j.status==="auth"||j.status==="forbidden"))return false;
    return true;
  }catch(e){return false;}
}
async function flushPendingQueue(){
  const q=getPendingQueue();
  if(q.length===0)return;
  for(const item of q){
    const ok=await sendPayload(item.payload);
    if(ok)queueRemove(item.queueId);
  }
}
function updateSyncBadge(){
  const el=document.getElementById("sync-badge");
  if(!el)return;
  const n=getPendingQueue().length;
  if(!navigator.onLine){
    el.textContent="🔴 No Connection"+(n>0?` — ${n} pending`:"");
    el.style.color="#D9756A";
  }else if(n>0){
    el.textContent=`🟡 ${n} pending sync...`;
    el.style.color="#C9A84C";
  }else{
    el.textContent="🟢 Online";
    el.style.color="#A8BE72";
  }
}
window.addEventListener("online",()=>{updateSyncBadge();flushPendingQueue();});
window.addEventListener("offline",updateSyncBadge);
setInterval(()=>{if(navigator.onLine)flushPendingQueue();updateSyncBadge();},30000);

      // "mawala" sa view habang naghihintay ng internet o ng susunod na retry.
      const pendingIds=new Set(
        getPendingQueue()
          .filter(item=>item.queueId&&item.queueId.startsWith("booking-"))
          .map(item=>Number(item.queueId.replace("booking-","")))
      );
      const localPendingOnly=bookings.filter(b=>pendingIds.has(b.id)&&!serverBookings.some(sb=>sb.id===b.id));
      bookings=[...serverBookings,...localPendingOnly];
      if(!silent) showSync("saved","✓ Bookings loaded from Google Sheets");
      render();
    } else if(!silent){
      showSync("idle","");
    }
  }catch(e){
    if(!silent) showSync("error","⚠ Could not load from Sheet — working offline");
  }
}

// ── GMAIL BOOKING NOTIFICATIONS ──────────────────────────
async function fetchWithTimeout(url,ms=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url,{signal:controller.signal});
    clearTimeout(timer);
    return res;
  }catch(e){
    clearTimeout(timer);
    throw e;
  }
}

const NOTIF_CACHE_KEY="sst_notif_cache_v1";
let _notifGmail=null,_notifMsg=null;
function applyNotifications(){
  const combined=[...(_notifGmail||[]),...(_notifMsg||[])];
  combined.sort((a,b)=>new Date(b.date)-new Date(a.date));
  notifications=combined;
  try{localStorage.setItem(NOTIF_CACHE_KEY,JSON.stringify({gmail:_notifGmail||[],msg:_notifMsg||[]}));}catch(e){}
  updateBellBadge();
  render();
}
// Ipakita agad ang huling alam na notifications habang naglo-load pa ang bago
(function(){try{const c=JSON.parse(localStorage.getItem(NOTIF_CACHE_KEY)||"null");if(c){_notifGmail=c.gmail||[];_notifMsg=c.msg||[];notifications=[..._notifGmail,..._notifMsg].sort((a,b)=>new Date(b.date)-new Date(a.date));}}catch(e){}})();
// Kinukuha ang isang uri ng alerts; kapag pumalya (hal. 404 mula sa Google), susubukan ulit
// pagkalipas ng ilang segundo — hanggang 3 beses — imbes na maghintay ng susunod na minuto.
function fetchNotifPart(action,onData,attempt){
  attempt=attempt||1;
  return fetchWithTimeout(SHEET_URL+"?action="+action+"&_="+Date.now(),25000)
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(d=>{onData(d.notifications||[]);applyNotifications();})
    .catch(()=>{
      if(attempt<3)return new Promise(res=>setTimeout(res,attempt*3000)).then(()=>fetchNotifPart(action,onData,attempt+1));
    });
}
async function loadNotifications(){
  // Sabay na kinukuha ang Gmail at Messenger — lalabas agad kung alin ang unang dumating
  await Promise.all([
    fetchNotifPart("notifications",list=>{_notifGmail=list;}),
    fetchNotifPart("messageAlerts",list=>{_notifMsg=list;})
  ]);
}

// ── ATTENDANCE (added) ──────────────────────────────────
function toggleAttModal(){attModalOpen=!attModalOpen;render();}
function todaysAttendance(staffId){return attendance.find(a=>a.staffId===staffId&&a.date===today);}
function isClockedIn(staffId){const a=todaysAttendance(staffId);return !!(a&&a.timeIn&&!a.timeOut);}
function attendanceKey(rec){return rec.staffId+"_"+rec.date;}
function mergeAttendanceRows(rows){
  const merged={};
  rows.forEach(a=>{
    const rec={staffId:Number(a.staffId),date:a.date,timeIn:a.timeIn||"",timeOut:a.timeOut||""};
    const key=attendanceKey(rec);
    const old=merged[key];
    if(!old){merged[key]=rec;return;}
    merged[key]={
      ...old,
      timeIn:old.timeIn&&rec.timeIn?(rec.timeIn<old.timeIn?rec.timeIn:old.timeIn):(old.timeIn||rec.timeIn),
      timeOut:rec.timeOut||old.timeOut
    };
  });
  return Object.values(merged);
}
function clockIn(staffId){
  const existing=todaysAttendance(staffId);
  if(existing&&existing.timeIn&&!existing.timeOut){render();return;}
  const timeNow=new Date().toTimeString().slice(0,5);
  const rec={staffId,date:today,timeIn:timeNow,timeOut:""};
  attendance=mergeAttendanceRows([...attendance.filter(a=>!(a.staffId===staffId&&a.date===today)),rec]);
  syncAttendance(rec);
  saveAttCache();
  render();
}
function clockOut(staffId){
  const existing=todaysAttendance(staffId);
  if(!existing||!existing.timeIn||existing.timeOut)return;
  const timeNow=new Date().toTimeString().slice(0,5);
  const rec={...existing,timeOut:timeNow};
  attendance=mergeAttendanceRows([...attendance.filter(a=>!(a.staffId===staffId&&a.date===today)),rec]);
  syncAttendance(rec);
  saveAttCache();
  render();
}
async function syncAttendance(rec){
  try{
    const st=staff.find(s=>s.id===rec.staffId);
    await fetch(SHEET_URL,{method:"POST",body:JSON.stringify({
      action:"setAttendance",staffId:String(rec.staffId),staffName:st?st.name:"",date:rec.date,
      id:String(rec.staffId)+"_"+rec.date,
      timeIn:rec.timeIn||"",timeOut:rec.timeOut||""
    })});
  }catch(e){
    // offline — attendance kept locally lang, susubukan ulit sa susunod na load
  }
}
async function loadAttendance(rangeStart,rangeEnd){
  try{
    const qs=rangeStart?("&start="+rangeStart+"&end="+rangeEnd):"";
    const res=await fetch(SHEET_URL+"?action=getAttendance"+qs);
    const data=await res.json();
    if(data&&data.attendance){
      const fresh=mergeAttendanceRows(data.attendance);
      // Merge instead of replace, so we don't lose rows outside the requested range
      const keys=new Set(fresh.map(a=>a.staffId+"_"+a.date));
      attendance=[...attendance.filter(a=>!keys.has(a.staffId+"_"+a.date)),...fresh];
      saveAttCache();
      render();
    }
  }catch(e){
    // walang biglaang alert — attendance load lang ito, hindi kritikal gaya ng bookings
  }
}

function fmt12(t){const m=hhmmToMin(t);if(m==null)return"—";const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+":"+String(mm).padStart(2,"0")+(h<12?" AM":" PM");}

function attRecMins(rec){
  if(!rec||!rec.timeIn||!rec.timeOut)return 0;
  const[ih,im]=rec.timeIn.split(":").map(Number);const[oh,om]=rec.timeOut.split(":").map(Number);
  let m=(oh*60+om)-(ih*60+im);if(m<0)m+=24*60;return m;
}
function fmtHrs(m){return m?(Math.round(m/60*10)/10)+"h":"—";}
function setAttendanceManual(staffId,date,field,val){

  attendance=[...attendance.filter(a=>!(a.staffId===staffId&&a.date===date)),rec];

    </div>
    <div class="att-grid">${list}</div>
    <div style="font-size:10px;color:var(--mt);margin-top:8px">Saved to Sheets automatically. This is for backlog or corrections only — daily Clock In/Out continues as usual. If the time out is past midnight (e.g. 1:00 AM), just enter 01:00.</div>
    <div style="margin-top:8px"><button class="btn bg2" style="font-size:11px" onclick="toggleAttEdit(${s.id})">✓ Done</button></div>
  </td></tr>`;
}
function attendanceHoursForRange(staffId,start,end){
  let totalMin=0;
  dateRange(start,end).forEach(d=>{
    const rec=attendance.find(a=>a.staffId===staffId&&a.date===d);
    if(rec&&rec.timeIn&&rec.timeOut){
      const[ih,im]=rec.timeIn.split(":").map(Number);
      const[oh,om]=rec.timeOut.split(":").map(Number);
      let mins=(oh*60+om)-(ih*60+im);
      if(mins<0)mins+=24*60;
      totalMin+=mins;
    }
  });
  return Math.round(totalMin/60*10)/10;
}

// ── PAYROLL (added) ─────────────────────────────────────
function fmtISO(y,m,day){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");}
// Petsa sa oras ng Pilipinas (local) — HUWAG gumamit ng toISOString() dahil UTC iyon at umuurong ng isang araw
function localISO(d){return fmtISO(d.getFullYear(),d.getMonth(),d.getDate());}
function currentPayrollPeriod(base){
  const d=base?new Date(base+"T00:00:00"):new Date(today+"T00:00:00");
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  if(day<=15)return{start:fmtISO(y,m,1),end:fmtISO(y,m,15)};
  const lastDay=new Date(y,m+1,0).getDate();
  return{start:fmtISO(y,m,16),end:fmtISO(y,m,lastDay)};
}
function initPayrollPeriod(){
  if(!payrollStart||!payrollEnd){
    const p=currentPayrollPeriod();
    payrollStart=p.start;payrollEnd=p.end;
    loadAttendance(payrollStart,payrollEnd);
    loadPayrollAdj(payrollStart,payrollEnd);
  }
}
function setPayrollPeriod(p){
  payrollStart=p.start;payrollEnd=p.end;
  loadAttendance(payrollStart,payrollEnd);
  loadPayrollAdj(payrollStart,payrollEnd);
  render();
}
// Pumili ng buwan (YYYY-MM) — mananatili sa parehong kalahati (1–15 o 16–katapusan)
function setPayrollMonth(ym){
  if(!/^\d{4}-\d{2}$/.test(ym||""))return;
  const second=payrollStart&&Number(payrollStart.slice(8,10))>=16;
  setPayrollPeriod(currentPayrollPeriod(ym+(second?"-16":"-01")));
}
function setPayrollHalf(half){
  const ym=(payrollStart||today).slice(0,7);
  setPayrollPeriod(currentPayrollPeriod(ym+(half===2?"-16":"-01")));
}
function shiftPayrollPeriod(dir){
  const base=dir<0?payrollStart:payrollEnd;
  const d=new Date(base+"T00:00:00");
  d.setDate(d.getDate()+(dir<0?-1:1));
  const p=currentPayrollPeriod(localISO(d));
  payrollStart=p.start;payrollEnd=p.end;
  loadAttendance(payrollStart,payrollEnd);
  loadPayrollAdj(payrollStart,payrollEnd);
  render();
}
function dateRange(startStr,endStr){
  const out=[];
  let d=new Date(startStr+"T00:00:00");
  const end=new Date(endStr+"T00:00:00");
  while(d<=end){out.push(localISO(d));d.setDate(d.getDate()+1);}
  return out;
}
function commissionForRange(staffId,start,end){
  return dateRange(start,end).reduce((sum,d)=>sum+staffDailyCommission(staffId,d),0);
}
function bracketAndAllowanceForRange(staffId,start,end){
  return dateRange(start,end).reduce((acc,d)=>{
    const b=staffCommissionBreakdown(staffId,d);
    acc.bracket+=b.bracket||0;
    acc.allowance+=b.allowance||0;
    return acc;
  },{bracket:0,allowance:0});
}
function payrollAdjKey(staffId,start,end){return staffId+"_"+start+"_"+end;}
let prSection="summary";
function setPrSection(k){prSection=k;attEditStaff=null;render();}
const EMPTY_ADJ={holiday:0,ot:0,deductions:0,otHours:0,lateMins:0,late:0,allowDays:"",lateOverride:""};
// Isang lugar ng kwenta para sa bawat staff — HIWA-HIWALAY ang bawat section, nagsasama lang sa huling Total
function payrollStaffCalc(s){
  const days=dateRange(payrollStart,payrollEnd);
  const comm=days.reduce((a,d)=>a+(staffCommissionBreakdown(s.id,d).bracket||0),0);
  const sales=days.reduce((a,d)=>a+staffSalesForDay(s.id,d),0);
  const adjustedDays=days.filter(d=>staffCommissionBreakdown(s.id,d).adjustedAfterPay);
  const worked=days.filter(d=>attRecMins(attendance.find(a=>a.staffId===s.id&&a.date===d))>0);
  const hrs=attendanceHoursForRange(s.id,payrollStart,payrollEnd);
  const adj=getPayrollAdj(s.id,payrollStart,payrollEnd);
  const r=payrollRates(s.id);
  const grp=staffGroupOn(s.id,payrollEnd||today);
  const fixed=grp!=="bracket";
  const allowOverride=!fixed&&adj.allowDays!==""&&adj.allowDays!=null;
  const allowDays=allowOverride?Number(adj.allowDays)||0:worked.length;
  const bawiDays=fixed?worked.filter(d=>dayAllowance(s.id,d)>0).length:0;
  const allowTotal=Math.round(allowOverride?allowDays*r.daily:worked.reduce((a,d)=>a+dayAllowance(s.id,d),0));
  const a=payrollAmounts(s.id,adj);
  const addTotal=a.otPay+a.holiday, dedTotal=a.lateDed+a.other;
  return{grp,fixed,bawiDays,comm,sales,adjustedDays,workedDays:worked.length,hrs,adj,rate:r.daily,perHour:r.perHour,perMin:r.perMin,
    allowOverride,allowDays,allowTotal,otPay:a.otPay,holiday:a.holiday,addTotal,lateDed:a.lateDed,other:a.other,dedTotal,

function notifParseDate(s){

  let t=s.replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s*/i,"").replace(/(\d)(st|nd|rd|th)\b/i,"$1");

// ── ROSTER (shift kada stylist, naka-plano in advance) ──
function shiftOn(staffId,dateStr){
  const hits=sstRoster().filter(e=>String(e.s)===String(staffId)&&e.f<=dateStr&&dateStr<=e.t);
  if(!hits.length)return null;
  hits.sort((a,b)=>Number(b.id)-Number(a.id)); // pinakabagong entry ang masusunod
  return hits[0].sh;
}
function isOffOn(staffId,dateStr){return shiftOn(staffId,dateStr)==="OFF";}
function callTimeOn(staffId,dateStr){
  const sh=shiftOn(staffId,dateStr);
  if(sh&&sh!=="OFF"){const x=sstShifts().find(s=>s.id===sh);if(x)return x.start;}
  const st=staff.find(x=>x.id===Number(staffId));
  return (st&&st.shiftStart)||sstShifts()[0].start||"09:00";
}
function staffCallTime(staffId){return callTimeOn(staffId,today);}
function lateMinsForRec(staffId,rec){
  if(!rec||!rec.timeIn)return 0;
  const d=rec.date||today;if(isOffOn(staffId,d))return 0;
  const tin=hhmmToMin(rec.timeIn),call=hhmmToMin(callTimeOn(staffId,d));
  if(tin==null||call==null)return 0;
  const late=tin-call;
  return late>lateGraceMin?late:0;
}
function sstMonday(ds){const d=new Date(ds+"T00:00:00");const k=(d.getDay()+6)%7;return addDays(ds,-k);}
function rosterShiftLbl(sh){if(sh==="OFF")return"OFF";const x=sstShifts().find(s=>s.id===sh);return x?x.name:"?";}
function rosterShiftTime(sh){const x=sstShifts().find(s=>s.id===sh);return x?fmt12(x.start)+"–"+fmt12(x.end):"";}
function rosterPick(id,ds){rosterForm={...rosterForm,s:String(id),f:ds,t:ds};render();setTimeout(()=>{const el=document.getElementById("ro-form");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},30);}
function rosterSet(k,v){rosterForm[k]=v;if(k==="f"&&(!rosterForm.t||rosterForm.t<v))rosterForm.t=v;}
async function rosterSave(){
  const F=rosterForm;
  if(!F.sh||!F.f||!F.t){alert("Choose the shift and the dates (from–to).");return;}
  if(F.t<F.f){alert("Invalid dates — 'To' is earlier than 'From'.");return;}
  if(!(await sstNeedAdmin("Save the roster / shift.")))return;
  const ids=F.s==="all"?staff.filter(s=>s.active).map(s=>s.id):[Number(F.s)];
  let t0=Date.now();
  commGroupCfg._roster=[...sstRoster(),...ids.map(id=>({id:t0++,s:id,sh:F.sh,f:F.f,t:F.t}))];
  if(await sstSaveCfg()){render();}
}
async function rosterDel(id){
  if(!confirm("Delete this roster entry?"))return;
  if(!(await sstNeedAdmin("Delete the roster entry.")))return;
  commGroupCfg._roster=sstRoster().filter(e=>e.id!==id);
  if(await sstSaveCfg())render();
}
async function rosterCopyPrev(){
  const wk=rosterWeek||sstMonday(today),prev=addDays(wk,-7);
  const add=[];let t0=Date.now();
  staff.filter(s=>s.active).forEach(s=>{for(let i=0;i<7;i++){const sh=shiftOn(s.id,addDays(prev,i));if(sh)add.push({id:t0++,s:s.id,sh,f:addDays(wk,i),t:addDays(wk,i)});}});
  if(!add.length){alert("Nothing was rostered last week.");return;}
  if(!confirm(`Copy ${add.length} shift(s) from the week of ${prev} to this week?`))return;
  if(!(await sstNeedAdmin("Copy the roster from last week.")))return;
  commGroupCfg._roster=[...sstRoster(),...add];

}

// ── DASHBOARD: naka-Time In lang ang lalabas (ngayong araw) ──
function schedulerStaff(){
  const dayB=db();
  const hasBk=s=>dayB.some(b=>bookingUsesStaff(b,s.id));
  if(selDate===today)return staff.filter(s=>isClockedIn(s.id)||hasBk(s));
  if(selDate<today)return staff.filter(s=>attendance.some(a=>Number(a.staffId)===s.id&&a.date===selDate&&a.timeIn)||hasBk(s));
  return staff.filter(s=>(s.active&&!isOffOn(s.id,selDate))||hasBk(s));
}

function isLockMode(b){return !!(b&&Number(b.staffId)&&String(b.date||"")>=LOCKMODE_START&&!lockOverride[b.id]);}
function askAdminPin(title){
  return new Promise(res=>{
    const bg=document.createElement("div");
    bg.style.cssText="position:fixed;inset:0;z-index:5000;background:rgba(20,18,14,.55);display:flex;align-items:center;justify-content:center;padding:16px";
    bg.innerHTML=`<div style="background:var(--s1,#fff);color:var(--wh,#222);border-radius:14px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)">
      <div style="font-weight:700;font-size:16px">🔒 Admin PIN</div>
      <div style="font-size:12.5px;color:var(--mt);margin:6px 0 12px">${title}</div>
      <input id="lk-pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="12" style="width:100%;padding:12px;font-size:22px;letter-spacing:.4em;text-align:center;-webkit-text-security:disc;border:1px solid var(--bd);border-radius:10px;background:var(--s2,#f6f6f6);color:inherit">
      <div id="lk-err" style="color:#C0392B;font-size:12px;min-height:16px;margin-top:6px"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button class="btn bgh" id="lk-c">Cancel</button><button class="btn bg2" id="lk-ok">OK</button></div></div>`;
    document.body.appendChild(bg);
    const inp=bg.querySelector("#lk-pin"),err=bg.querySelector("#lk-err");setTimeout(()=>inp.focus(),50);
    const done=v=>{bg.remove();res(v);};
    const go=()=>{if(sha256Hex("nu-lock|"+inp.value.trim())===LOCK_ADMIN_HASH)done(true);else{err.textContent="Wrong PIN";inp.select();}};
    bg.querySelector("#lk-ok").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go();};
    bg.querySelector("#lk-c").onclick=()=>done(false);
  });
}
async function adminUnlockBooking(id){
  if(await askAdminPin("Unlock this booking to change the service / price or delete it. It will be recorded as 'Amended · Admin'.")){lockOverride[id]=true;render();}
