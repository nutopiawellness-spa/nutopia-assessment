async function lockedDelete(id){
  const b=bookings.find(x=>x.id===id);
  if(isLockMode(b)){
    if(!(await askAdminPin("This booking is LOCKED (assigned). Admin is required to delete it.")))return;
    lockOverride[id]=true;
  }
  if(!confirm("Delete this booking? It will also be removed from sales and commission."))return;
  delBooking(id);
}


// ── SST: WALANG bracket at WALANG Fixed 20% / 10% — iisang formula lang (SST Commission Calculator) ──
function staffGroupOn(staffId,dateStr){return"bracket";} // internal lang (para sa Daily Allowance sa payroll); walang bracket rate na ginagamit
function commGroupLabel(g){return"SST Formula";}
function projectedStaffDailyCommission(staffId,dateStr,extraPrice,extraPayMethod,excludeId,extraSvcId){
  let c=0;
  bookings.filter(b=>b.date===dateStr&&Number(b.staffId)===Number(staffId)&&b.id!==excludeId).forEach(b=>{c+=sstLineComm((Number(b.price)||0)+extrasTotal(b),staffId,svcs.find(x=>x.id===Number(b.svcId)));});
  sales.filter(s=>s.date===dateStr&&!s.linkedBookingId).forEach(s=>(s.lines||[]).filter(l=>l.type==='service'&&Number(l.staffId)===Number(staffId)).forEach(l=>{c+=sstLineComm((Number(l.price)||0)*(Number(l.qty)||1),staffId,svcs.find(x=>x.id===Number(l.refId)));}));
  if(extraPrice)c+=sstLineComm(extraPrice,staffId,svcs.find(x=>x.id===Number(extraSvcId)));
  return Math.round(c);
}

const SST_LEAVES=[{id:"OFF",short:"OFF",name:"Day Off",color:"#5E5E52",bg:"#E6E4DC"},{id:"SL",short:"SL",name:"Sick Leave",color:"#A8322A",bg:"#F6DEDA"},{id:"VL",short:"VL",name:"Vacation Leave",color:"#2F6B9A",bg:"#DCE8F3"},{id:"EL",short:"EL",name:"Emergency Leave",color:"#9A5B00",bg:"#F7E3C0"}];
function sstLeave(code){return SST_LEAVES.find(l=>l.id===code)||null;}
function sstShifts(){
  const s=commGroupCfg._shifts;
  const old=Array.isArray(s)&&s.length===1&&s[0].id==="reg"&&s[0].start==="09:00"&&s[0].end==="19:00"; // lumang default (v4) → bagong 2 shift
  return Array.isArray(s)&&s.length&&!old?s:[{id:"am",name:"Shift A",start:"09:00",end:"18:00"},{id:"pm",name:"Shift B",start:"10:00",end:"19:00"}];
}
function isOffOn(staffId,dateStr){return !!sstLeave(shiftOn(staffId,dateStr));}
function rosterShiftLbl(sh){const lv=sstLeave(sh);if(lv)return lv.name;const x=sstShifts().find(s=>s.id===sh);return x?x.name:"?";}
function rosterCellHtml(sh){
  const lv=sstLeave(sh);if(lv)return `<b style="color:${lv.color}">${lv.short}</b><div style="font-size:9.5px;color:${lv.color}">${lv.name}</div>`;

      </div>
      <div id="otp-msg" style="font-size:12px;min-height:16px;margin-top:8px;text-align:center"></div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button class="btn bgh" id="otp-c">Cancel</button><button class="btn bg2" id="otp-go">📧 Send OTP</button></div></div>`;
    document.body.appendChild(bg);
    const $=s=>bg.querySelector(s),msg=(t,c)=>{$("#otp-msg").innerHTML=t;$("#otp-msg").style.color=c||"var(--mt)";};
    let step=1,busy=false;const done=v=>{bg.remove();res(v);};
    $("#otp-c").onclick=()=>done(false);
    const send=async()=>{
      const by=$("#otp-by")?$("#otp-by").value:"";const why=$("#otp-why")?$("#otp-why").value.trim():"";
      if(step===1&&!by){msg("Choose who is requesting.","#B0392B");return;}
      busy=true;msg("Sending…");

        const q=new URLSearchParams({action:"requestOtp",id:String(b.id),act,info:bkSummary(b),by:by||bg._by||"",why:why||bg._why||""});
        const rr=await fetch(SHEET_URL+"?"+q.toString());const tx=await rr.text();let j=null;try{j=JSON.parse(tx);}catch(pe){msg("Server error — the Apps Script could not send the email. Open Apps Script → run testOtpEmail → Allow, then Deploy a New version.","#B0392B");busy=false;return;}
        if(j&&j.status==="ok"){bg._by=by||bg._by;bg._why=why||bg._why;step=2;$("#otp-s1").style.display="none";$("#otp-s2").style.display="";$("#otp-go").textContent="✓ Verify";
          msg(`Sent to the owner email${j.to?" ("+tlEsc(j.to)+")":""}. The code is valid for 5 minutes. <a href="#" id="otp-re">Resend</a>`);
          const re=$("#otp-re");if(re)re.onclick=e=>{e.preventDefault();step=1;send();};setTimeout(()=>$("#otp-code").focus(),50);}
        else msg((j&&j.msg)||"Not sent — please try again.","#B0392B");
      }catch(e){msg("Could not reach the server — the OTP was not sent.","#B0392B");}
      busy=false;
    };
    const verify=async()=>{
      const code=$("#otp-code").value.replace(/\D/g,"");if(code.length!==6){msg("The code has 6 digits.","#B0392B");return;}
      busy=true;msg("Checking…");

        if(j&&j.status==="ok"){done(true);return;}

      busy=false;
    };
    $("#otp-go").onclick=()=>{if(busy)return;step===1?send():verify();};

  });

  };
  bk.forEach(b=>{
    const sv=svcs.find(x=>x.id===Number(b.svcId));
    const L=sstBookingLines(b).map((l,i)=>({label:i===0?(sv?sv.name:l.label):String(l.label).replace(/^\+\s*/,""),amt:Number(l.price)||0,st:nm(l.sid)}));
    if(b.homeService&&Number(b.homeFee))L.push({label:"Home service fee",amt:Number(b.homeFee),st:"",forceLabel:true});
    const disc=bookingDisc(b);if(disc){const di=bookingDiscInfo9(b);L.push({label:"Less: "+(di.type||"Discount")+(di.pct?" "+di.pct+"%":""),amt:-disc,st:"",forceLabel:true});}
    block(b.date,clientLabel(b),sv?sv.name+(sv.v?" · "+sv.v:""):"Service",L,bookingTotal(b),b.payMethod);
  });
  (ps||[]).forEach(x=>{
    const L=(x.lines||[]).map(l=>({label:l.name+(Number(l.qty)>1?" ×"+l.qty:""),amt:(Number(l.price)||0)*(Number(l.qty)||1),st:l.staffName||nm(l.staffId),forceLabel:true}));
    const sub=Number(x.subtotal)||L.reduce((a,l)=>a+l.amt,0),tot=Number(x.total)||0;
    if(sub-tot>0.009)L.push({label:"Less: discount"+(Number(x.discountPct)?" "+x.discountPct+"%":""),amt:-(sub-tot),st:"",forceLabel:true});
    if(!L.length)L.push({label:"",amt:tot,st:""});
    block(x.date,x.customerName||"Walk-in (POS)",L.some(l=>/product|shampoo|conditioner/i.test(l.label))?"POS sale":"POS sale",L,tot,x.payMethod);
  });
  const last=aoa.length-1;
  aoa.push([]);aoa.push(["","","","Total sales","","",""]);
  const totRow=aoa.length-1;
  const ws=X.utils.aoa_to_sheet(aoa);
  ws["!merges"]=merges;
  if(last>=1)ws["!autofilter"]={ref:"A1:H"+(last+1)};
  ws["F"+(totRow+1)]={t:"n",f:"SUM(F2:F"+(last+1)+")",v:aoa.slice(1,last+1).reduce((a,r)=>a+(Number(r[5])||0),0),z:"#,##0.00"};
  ws["!cols"]=[{wch:12},{wch:20},{wch:34},{wch:20},{wch:14},{wch:14},{wch:16},{wch:14}];
  const thin={style:"thin",color:{rgb:"000000"}},B={top:thin,bottom:thin,left:thin,right:thin};
  const enc=(r,c)=>X.utils.encode_cell({r,c});
  for(let c=0;c<8;c++){const k=enc(0,c);ws[k]=ws[k]||{t:"s",v:""};ws[k].s={font:{name:"Arial",bold:true,sz:11},alignment:{horizontal:"center",vertical:"bottom",wrapText:true},border:B,fill:{patternType:"solid",fgColor:{rgb:"F2F2F2"}}};}
  for(let r=1;r<=last;r++)for(let c=0;c<8;c++){const k=enc(r,c);if(!ws[k])ws[k]={t:"s",v:""};
    const money=c===4||c===5;if(money&&ws[k].t==="n")ws[k].z="#,##0.00";
    ws[k].s={font:{name:"Arial",sz:11},alignment:{vertical:"bottom",wrapText:true,horizontal:money||c===0?"right":"left"},border:B,numFmt:money?"#,##0.00":undefined};}
  const tk=enc(totRow,3);if(ws[tk])ws[tk].s={font:{name:"Arial",bold:true,sz:11}};
  ws["F"+(totRow+1)].s={font:{name:"Arial",bold:true,sz:11},numFmt:"#,##0.00",alignment:{horizontal:"right"}};
  ws["!rows"]=[{hpt:30}];
  return ws;
}
// Duplicate client name on the same day → red alert + Admin PIN (same as NUtopia)
function nm11(s){return String(s||"").toLowerCase().replace(/[^a-z0-9ñ ]/g," ").replace(/\s+/g," ").trim();}
function dg11(s){return String(s||"").replace(/\D/g,"").slice(-10);}
function nameClash11(){
  if(!modal||!form||form._guestOf||modal.chainedFromId)return null;
  const me=modal.mode==='edit'?modal.bkId:null,d=form.date||selDate,n=nm11(form.client);
  if(!n||n.length<3)return null;
  if(me){const old=bookings.find(b=>b.id===me);if(old&&nm11(old.client)===n)return null;}
  return bookings.find(b=>b.id!==me&&b.date===d&&nm11(b.client)===n)||null;
}
function mobileClash11(){
  if(!modal||!form||form._guestOf||modal.chainedFromId)return null;
  const me=modal.mode==='edit'?modal.bkId:null,d=form.date||selDate,m=dg11(form.mobile),n=nm11(form.client);
  if(m.length<10)return null;
  if(me){const old=bookings.find(b=>b.id===me);if(old&&dg11(old.mobile)===m)return null;}
  return bookings.find(b=>b.id!==me&&b.date===d&&dg11(b.mobile)===m&&nm11(b.client)!==n)||null;
}
function tm11(b){const m=timeToMin(b.time),h=Math.floor(m/60)%24;return((h%12)||12)+":"+String(m%60).padStart(2,"0")+(h>=12?" PM":" AM");}
function svn11(b){const s=svcs.find(x=>x.id===Number(b.svcId));return s?s.name:"service";}
function nameAlert11(){
  const el=document.getElementById("dup11");if(!el)return;
  const c=nameClash11();
  el.innerHTML=c?`⛔ <b>${tlEsc(c.client)}</b> already has a booking today (${tlEsc(svn11(c))} at ${tm11(c)}). To add a service, open that booking and add it as an add-on.`:"";
  el.style.display=c?"block":"none";
}
const _saveBooking11=saveBooking;
saveBooking=async function(){
  if(!modal||!form)return _saveBooking11.apply(this,arguments);
  const c=nameClash11();
  if(c){const ok=await askAdminPin(`⛔ <b>${tlEsc(c.client)}</b> already has a booking today (${tlEsc(svn11(c))} at ${tm11(c)}).<br>To add a service for the same client, open their booking and add it as an <b>add-on</b> (or 🔗 Add another service).<br>Enter the Admin PIN only if this is a <b>different person</b> with the same name.`);if(!ok)return;}
  else{const m=mobileClash11();if(m&&!confirm(`⚠️ This mobile number is already used today by ${m.client} (${svn11(m)} at ${tm11(m)}).\n\nIs this really a different client? (OK = continue)`))return;}
  return _saveBooking11.apply(this,arguments);
};
// live red alert under the client name while typing
const _render11=render;
render=function(){const r=_render11.apply(this,arguments);try{
  if(modal&&form&&!document.getElementById("dup11")){const inp=document.getElementById("fld-client");
    if(inp){const box=document.createElement("div");box.id="dup11";box.style.cssText="display:none;margin-top:6px;padding:8px 10px;border-radius:8px;background:#F6DEDA;color:#A8322A;font-size:12px;font-weight:600;border:1px solid #A8322A";(inp.closest(".fld")||inp.parentNode).appendChild(box);}}
  nameAlert11();}catch(e){}return r;};
document.addEventListener("input",e=>{if(e.target&&e.target.tagName==="INPUT")setTimeout(nameAlert11,0);},true);
</script>
