function toggleAttModal(){attModalOpen=!attModalOpen;render();}
function todaysAttendance(staffId){return attendance.find(a=>a.staffId===staffId&&a.date===today);}
function isClockedIn(staffId){const a=todaysAttendance(staffId);return !!(a&&a.timeIn&&!a.timeOut);}
function attendanceKey(rec){return rec.staffId+"_"+rec.date;}
function mergeAttendanceRows(rows){
  const merged={};
  rows.forEach(a=>{
    const rec={staffId:Number(a.staffId),date:a.date,timeIn:a.timeIn||"",timeOut:a.timeOut||""};
    const key=attendanceKey(rec);
    const old=merged[key];
    if(!old){merged[key]=rec;return;}
    merged[key]={
      ...old,
      timeIn:old.timeIn&&rec.timeIn?(rec.timeIn<old.timeIn?rec.timeIn:old.timeIn):(old.timeIn||rec.timeIn),
      timeOut:rec.timeOut||old.timeOut
    };
  });
  return Object.values(merged);
}
function clockIn(staffId){
  const existing=todaysAttendance(staffId);
  if(existing&&existing.timeIn&&!existing.timeOut){render();return;}
  const timeNow=new Date().toTimeString().slice(0,5);
  const rec={staffId,date:today,timeIn:timeNow,timeOut:""};
  attendance=mergeAttendanceRows([...attendance.filter(a=>!(a.staffId===staffId&&a.date===today)),rec]);
  syncAttendance(rec);
  saveAttCache();
  render();
}
function clockOut(staffId){
  const existing=todaysAttendance(staffId);
  if(!existing||!existing.timeIn||existing.timeOut)return;
  const timeNow=new Date().toTimeString().slice(0,5);
  const rec={...existing,timeOut:timeNow};
  attendance=mergeAttendanceRows([...attendance.filter(a=>!(a.staffId===staffId&&a.date===today)),rec]);
  syncAttendance(rec);
  saveAttCache();
  render();
}
async function syncAttendance(rec){
  try{
    const st=staff.find(s=>s.id===rec.staffId);
    await fetch(SHEET_URL,{method:"POST",body:JSON.stringify({
      action:"setAttendance",staffId:String(rec.staffId),staffName:st?st.name:"",date:rec.date,
      id:String(rec.staffId)+"_"+rec.date,
      timeIn:rec.timeIn||"",timeOut:rec.timeOut||""
    })});
  }catch(e){
    // offline — attendance kept locally lang, susubukan ulit sa susunod na load
  }
}
async function loadAttendance(rangeStart,rangeEnd){
  try{
    const qs=rangeStart?("&start="+rangeStart+"&end="+rangeEnd):"";
    const res=await fetch(SHEET_URL+"?action=getAttendance"+qs);
    const data=await res.json();
    if(data&&data.attendance){
      const fresh=mergeAttendanceRows(data.attendance);
      // Merge instead of replace, so we don't lose rows outside the requested range
      const keys=new Set(fresh.map(a=>a.staffId+"_"+a.date));
      attendance=[...attendance.filter(a=>!keys.has(a.staffId+"_"+a.date)),...fresh];
      saveAttCache();
      render();
    }
  }catch(e){
    // walang biglaang alert — attendance load lang ito, hindi kritikal gaya ng bookings
  }
}

function fmt12(t){const m=hhmmToMin(t);if(m==null)return"—";const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+":"+String(mm).padStart(2,"0")+(h<12?" AM":" PM");}

function attRecMins(rec){
  if(!rec||!rec.timeIn||!rec.timeOut)return 0;
  const[ih,im]=rec.timeIn.split(":").map(Number);const[oh,om]=rec.timeOut.split(":").map(Number);
  let m=(oh*60+om)-(ih*60+im);if(m<0)m+=24*60;return m;
}
function fmtHrs(m){return m?(Math.round(m/60*10)/10)+"h":"—";}
function setAttendanceManual(staffId,date,field,val){

  attendance=[...attendance.filter(a=>!(a.staffId===staffId&&a.date===date)),rec];

  // i-update lang ang mga numero (hindi buong render) para hindi mawala ang cursor habang nagta-type
  const dh=document.getElementById("atth-"+staffId+"-"+date);if(dh)dh.textContent=fmtHrs(attRecMins(rec));
  const hrs=attendanceHoursForRange(staffId,payrollStart,payrollEnd);
  const days=dateRange(payrollStart,payrollEnd).filter(d=>attRecMins(attendance.find(a=>a.staffId===staffId&&a.date===d))>0).length;

function attendanceHoursForRange(staffId,start,end){
  let totalMin=0;
  dateRange(start,end).forEach(d=>{
    const rec=attendance.find(a=>a.staffId===staffId&&a.date===d);
    if(rec&&rec.timeIn&&rec.timeOut){
      const[ih,im]=rec.timeIn.split(":").map(Number);
      const[oh,om]=rec.timeOut.split(":").map(Number);
      let mins=(oh*60+om)-(ih*60+im);
      if(mins<0)mins+=24*60;
      totalMin+=mins;
    }
  });
  return Math.round(totalMin/60*10)/10;
}

function unlockAttendanceAction(staffId,which){
  const pin=prompt("Ilagay ang PIN para i-unlock ang Time "+(which==='in'?'In':'Out')+":");
  if(pin===null)return;
  if(pin!==ADMIN_PIN){alert("Maling PIN.");return;}

  const updated={...rec,[which==='in'?'timeIn':'timeOut']:""};

function fmtISO(y,m,day){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");}
// Petsa sa oras ng Pilipinas (local) — HUWAG gumamit ng toISOString() dahil UTC iyon at umuurong ng isang araw
function localISO(d){return fmtISO(d.getFullYear(),d.getMonth(),d.getDate());}
function currentPayrollPeriod(base){
  const d=base?new Date(base+"T00:00:00"):new Date(today+"T00:00:00");
  const y=d.getFullYear(),m=d.getMonth(),day=d.getDate();
  if(day<=15)return{start:fmtISO(y,m,1),end:fmtISO(y,m,15)};
  const lastDay=new Date(y,m+1,0).getDate();
  return{start:fmtISO(y,m,16),end:fmtISO(y,m,lastDay)};
}
function initPayrollPeriod(){

// Isang lugar ng kwenta para sa bawat staff — HIWA-HIWALAY ang bawat section, nagsasama lang sa huling Total
function payrollStaffCalc(s){
  const days=dateRange(payrollStart,payrollEnd);
  const comm=days.reduce((a,d)=>a+(staffCommissionBreakdown(s.id,d).bracket||0),0);
  const sales=days.reduce((a,d)=>a+staffSalesForDay(s.id,d),0);

  const worked=days.filter(d=>attRecMins(attendance.find(a=>a.staffId===s.id&&a.date===d))>0);
  const hrs=attendanceHoursForRange(s.id,payrollStart,payrollEnd);
  const adj=getPayrollAdj(s.id,payrollStart,payrollEnd);
  const r=payrollRates(s.id);
  const grp=staffGroupOn(s.id,payrollEnd||today);
  const fixed=grp!=="bracket";
  const allowOverride=!fixed&&adj.allowDays!==""&&adj.allowDays!=null;
  const allowDays=allowOverride?Number(adj.allowDays)||0:worked.length;
  const bawiDays=fixed?worked.filter(d=>dayAllowance(s.id,d)>0).length:0;
  const allowTotal=Math.round(allowOverride?allowDays*r.daily:worked.reduce((a,d)=>a+dayAllowance(s.id,d),0));
  const a=payrollAmounts(s.id,adj);
  const addTotal=a.otPay+a.holiday, dedTotal=a.lateDed+a.other;
  return{grp,fixed,bawiDays,comm,sales,adjustedDays,workedDays:worked.length,hrs,adj,rate:r.daily,perHour:r.perHour,perMin:r.perMin,
    allowOverride,allowDays,allowTotal,otPay:a.otPay,holiday:a.holiday,addTotal,lateDed:a.lateDed,other:a.other,dedTotal,
    lateAuto:a.lateAuto,lateManual:a.lateManual,lateMinsEff:a.lateMinsEff,lateDays:lateDaysCount(s.id),callTime:staffCallTime(s.id),
    net:comm+allowTotal+addTotal-dedTotal};

const WORK_HOURS_PER_DAY=8;

const DEFAULT_CALL_TIME="11:00";

function hhmmToMin(t){const m=String(t||"").match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null;}
function staffCallTime(staffId){const st=staff.find(x=>x.id===Number(staffId));return (st&&st.shiftStart)||DEFAULT_CALL_TIME;}
function lateMinsForRec(staffId,rec){
  if(!rec||!rec.timeIn)return 0;
  const tin=hhmmToMin(rec.timeIn),call=hhmmToMin(staffCallTime(staffId));

function payrollAmounts(staffId,adj){

// ── Booking Alert (bot / GHL) → naka-fill na ang form: petsa, oras, service, pax, payment, email.

function notifParseDate(s){
  s=String(s||"").trim();if(!s)return "";
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  let t=s.replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s*/i,"").replace(/(\d)(st|nd|rd|th)\b/i,"$1");
  if(!/\b\d{4}\b/.test(t))t+=" "+new Date().getFullYear();
  const d=new Date(t);if(isNaN(d.getTime()))return "";
  let iso=localISO(d);
  if(iso<today&&!/\b\d{4}\b/.test(s)){d.setFullYear(d.getFullYear()+1);iso=localISO(d);} // hal. "Jan 3" sa Disyembre → susunod na taon
  return iso;
}
function notifParseTime(s){
  const m=String(s||"").match(/(\d{1,2})(?::(\d{2}))?\s*([ap])\.?\s*m/i)||String(s||"").match(/\b(\d{1,2}):(\d{2})\b/);
  if(!m)return "";
  let h=Number(m[1])%12,mn=Number(m[2]||0);
  if(m[3]){if(/p/i.test(m[3]))h+=12;}else h=Number(m[1]);
  let tot=h*60+mn;tot=Math.round(tot/15)*15;
  const v=minToTimeVal(tot);
  return SLOTS.some(x=>x.val===v)?v:"";
}
function notifNorm(s){return String(s||"").toLowerCase().replace(/&|\+/g," ").replace(/\band\b/g," ").replace(/minutes?|mins?\b/g,"min").replace(/(\d+)\s*min/g,"$1 min").replace(/[^a-z0-9]+/g," ").trim();}
function notifMatchService(text){
  const q=notifNorm(text);if(!q)return null;
  const list=svcs.filter(s=>s.p>0);
  let hit=list.find(s=>notifNorm(s.name+" "+(s.v||""))===q)||list.find(s=>notifNorm(s.name)===q);
  if(!hit){
    const pre=list.filter(s=>notifNorm(s.name).startsWith(q+" "));
    if(pre.length&&pre.every(s=>s.name===pre[0].name))hit=pre[0];
  }
  if(!hit){
    const inside=list.filter(s=>notifNorm(s.name).length>=4&&q.includes(notifNorm(s.name))).sort((a,b)=>b.name.length-a.name.length);
    if(inside.length){const top=notifNorm(inside[0].name).length;const best=inside.filter(s=>notifNorm(s.name).length===top);hit=best.find(s=>s.v&&q.includes(notifNorm(s.v)))||best[0];}
  }
  if(hit)return hit;
  if(/facial|hydra|hifu|peel|eye/.test(q))return svcs.find(s=>s.id===151)||null;
  if(/massage|hilot|swedish|shiatsu|thai|ventosa|reflex|lymph|aroma/.test(q))return svcs.find(s=>s.id===150)||null;
  return null;
}
function notifPay(s){
  const t=String(s||"").toLowerCase();
  if(/credit/.test(t))return "Credit Card";
  if(/debit/.test(t))return "Debit Card";
  if(/card|visa|master/.test(t))return "Credit Card";
  if(/gcash|g-cash/.test(t))return "GCash";
  if(/bank|bpi|bdo|transfer/.test(t))return "Bank Transfer";
  if(/cash/.test(t))return "Cash";
  return "";
}

// ── WALANG BUTAL: hatiin ang package nang buong piso; ang sobra ay sa unang pax (₱4,999 → ₱2,500 + ₱2,499) ──
function paxShare(svc,i){const n=paxCountFor(svc);const p=Math.round(Number(svc.p)||0);const base=Math.floor(p/n),rem=p-base*n;return i<rem?base+1:base;}
function perPaxPrice(svc){return svc?(isPkgPax(svc)?paxShare(svc,0):svc.p):0;}
function paxSplitText(svc){
  const n=paxCountFor(svc),a=paxShare(svc,0),b=paxShare(svc,n-1);
  if(a===b)return `₱${a.toLocaleString()} bawat isa`;
  const na=Array.from({length:n},(_,i)=>paxShare(svc,i)).filter(v=>v===a).length;
  return `₱${a.toLocaleString()} ×${na} + ₱${b.toLocaleString()} ×${n-na} = ₱${Math.round(svc.p).toLocaleString()}`;
}
// Kapag ine-edit ang isang pax ng package at hindi pinalitan ang service → panatilihin ang dating hati niya
function formUnitPrice(ss){

}

const DISC_RE=/\[Disc: ([^=\]]*)=(\d+)\]\s*(\|\s*)?/;
function parseDisc(notes){const m=String(notes||"").match(DISC_RE);return m?{type:m[1].trim(),amt:Number(m[2])||0}:{type:"",amt:0};}
function stripDiscNotes(notes){return String(notes||"").replace(DISC_RE,"").trim();}
function buildDiscNotes(notes,type,amt){
  const clean=stripDiscNotes(notes);const a=Math.max(0,Math.round(Number(amt)||0));
  if(!type||!a)return clean;
  return `[Disc: ${String(type).replace(/[\[\]=|]/g," ").trim()}=${a}]`+(clean?" | "+clean:"");
}
function bookingDisc(b){return parseDisc(b&&b.notes).amt;}
function bookingGross(b){return(Number(b.price)||0)+extrasTotal(b)+(b.homeService?(Number(b.homeFee)||0):0);}
function bookingTotal(b){return Math.max(0,bookingGross(b)-bookingDisc(b));}
function formGross(){const ss=svcs.find(s=>s.id===Number(form.svcId));if(!ss)return 0;return formUnitPrice(ss)+formExtrasTotal()+(form.homeService?(Number(form.homeFee)||0):0);}
function formDiscAmt(){return form.discType?Math.min(formGross(),Math.max(0,Math.round(Number(form.discAmt)||0))):0;}
function formDue(){return Math.max(0,formGross()-formDiscAmt());}
function dueBreakdown(){
  const ss=svcs.find(s=>s.id===Number(form.svcId));if(!ss)return "";
  const parts=[php(formUnitPrice(ss))+" service"];
  const ex=formExtrasTotal();if(ex)parts.push(php(ex)+" extra");
  const hf=form.homeService?(Number(form.homeFee)||0):0;if(hf)parts.push(php(hf)+" home fee");
  const d=formDiscAmt();
  const pax=modal&&modal.mode!=='edit'?bookingPax(ss):1;
  const asset=assetDeduction(ss.id,form.date||selDate);
  return parts.join(" + ")+(d?` − <b style="color:#B0392B">${php(d)} discount (${tlEsc(form.discType)})</b>`:"")
    +(pax>1&&!isPkgPax(ss)?` · bawat pax (${pax} pax = ${php(perPaxPrice(ss)*pax)} lahat)`:"")
    +(isPkgPax(ss)&&modal&&modal.mode!=='edit'?`<br>Package ${php(ss.p)}: ${paxSplitText(ss)}`:"")
    +(asset?`<br>💧 ${php(asset)} nito ay Sauna/Jacuzzi (company asset) — <b>walang commission</b>; ${php(Math.max(0,formUnitPrice(ss)-asset))} lang ang may commission ng therapist.`:"");
}

    if(!j||!(j.ok||j.status==="ok")){
      alert("⚠️ HINDI na-save sa Google Sheet ang roster"+(j&&j.status==="auth"?" — naka-logout / expired ang login. Mag-login ulit at i-save muli.":j&&j.msg?": "+j.msg:" — i-check ang internet at subukan ulit."));
      showSync("error","⚠ Hindi na-save ang roster");return false;
    }
    const v=await (await fetch(SHEET_URL+"?action=getAppSettings")).json();
    const g=JSON.parse((v&&v.settings&&v.settings.commGroups)||"{}");
    if(JSON.stringify(g._roster||[])!==want){alert("⚠️ Na-send pero hindi tugma ang nasa Google Sheet. Subukan ulit i-save. Kung ganoon pa rin, i-screenshot at ipadala.");showSync("error","⚠ Roster hindi tugma sa Sheet");return false;}
    showSync("saved","✓ Na-save at na-check sa Google Sheet");return true;
  }catch(e){alert("⚠️ Hindi na-save — walang internet o hindi ma-reach ang Google Sheet.");showSync("error","⚠ Hindi na-save");return false;}
}
// Ibang device: kusang kinukuha ang bagong roster bawat 1 minuto
setInterval(()=>{if(navigator.onLine&&!modal&&!shiftsDraft&&(tab==='board'||tab==='roster'))loadAppSettings();},60000);

render();
if(!LOGIN_ENABLED){
  startApp(); // naka-off pa ang login — diretso sa scheduler gaya ng dati
}else if(SESSION){
  startApp();
  fetch(SHEET_URL+"?action=whoami").then(r=>r.json()).then(j=>{if(j&&j.status==="ok"&&j.user){SESSION.user=j.user;saveSession();render();}}).catch(()=>{});
}else{
  showLogin();
}
